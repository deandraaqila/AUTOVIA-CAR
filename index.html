<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AUTOVIA — Complete Showroom Management System</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="icon" type="image/png" sizes="32x32" href="Autovia2.png">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          colors: {
            av: {
              bg: '#0B0D12', sec: '#151922', card: '#1B202B', border: '#262D3D',
              primary: '#2563EB', secondary: '#60A5FA', success: '#22C55E',
              warning: '#F59E0B', danger: '#EF4444', muted: '#9CA3AF',
            }
          }
        }
      }
    };
  </script>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script src="config.js"></script>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #0B0D12; color: #FFFFFF;
      font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; overflow: hidden;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0B0D12; }
    ::-webkit-scrollbar-thumb { background: #262D3D; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #3B465E; }
    .swal2-popup { background: #1B202B !important; color: #FFFFFF !important; border: 1px solid #262D3D !important; border-radius: 16px !important; font-family: 'Plus Jakarta Sans', sans-serif !important; }
    .swal2-title, .swal2-html-container { color: #FFFFFF !important; }
    .swal2-confirm { background-color: #2563EB !important; border-radius: 10px !important; }
    .swal2-cancel { background-color: #262D3D !important; border-radius: 10px !important; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    const ROLES = {
      SUPER_ADMIN: { id: "SUPER_ADMIN", label: "Super Admin", allowedSections: ["OVERVIEW", "MASTER DATA", "TRANSAKSI", "LAPORAN", "SISTEM"], canDelete: true, canApprove: true, canManageUsers: true, badgeColor: "bg-red-500/20 text-red-400 border-red-500/30" },
      MANAGER: { id: "MANAGER", label: "Manager", allowedSections: ["OVERVIEW", "MASTER DATA", "TRANSAKSI", "LAPORAN"], canDelete: true, canApprove: true, canManageUsers: false, badgeColor: "bg-blue-500/20 text-blue-400 border-blue-500/30" },
      ADMIN_INVENTORY: { id: "ADMIN_INVENTORY", label: "Admin Inventaris", allowedSections: ["OVERVIEW", "MASTER DATA", "TRANSAKSI"], canDelete: false, canApprove: false, canManageUsers: false, badgeColor: "bg-amber-500/20 text-amber-400 border-amber-500/30" },
      ADMIN_FINANCE: { id: "ADMIN_FINANCE", label: "Admin Keuangan", allowedSections: ["OVERVIEW", "TRANSAKSI", "LAPORAN"], canDelete: false, canApprove: true, canManageUsers: false, badgeColor: "bg-emerald-500/20 text-emerald-400 border-emerald-500/30" },
      SALES: { id: "SALES", label: "Sales Executive", allowedSections: ["OVERVIEW", "TRANSAKSI"], canDelete: false, canApprove: false, canManageUsers: false, badgeColor: "bg-purple-500/20 text-purple-400 border-purple-500/30" }
    };

    const SIDEBAR_GROUPS = [
      { group: "OVERVIEW", label: "OVERVIEW", items: [
        { id: "dashboard", label: "Dashboard", icon: "layout-dashboard" },
        { id: "notifications", label: "Notifikasi", icon: "bell" }
      ]},
      { group: "MASTER DATA", label: "MASTER DATA", items: [
        { id: "cars", label: "Inventaris Mobil", icon: "car" },
        { id: "customers", label: "Pelanggan", icon: "users" },
        { id: "suppliers", label: "Supplier", icon: "truck" }
      ]},
      { group: "TRANSAKSI", label: "TRANSAKSI", items: [
        { id: "purchases", label: "Pembelian", icon: "shopping-cart" },
        { id: "sales", label: "Penjualan", icon: "tag" },
        { id: "payments", label: "Pembayaran", icon: "credit-card" },
        { id: "expenses", label: "Pengeluaran", icon: "wallet" }
      ]},
      { group: "LAPORAN", label: "LAPORAN", items: [
        { id: "finance-report", label: "Laporan Keuangan", icon: "bar-chart-2" }
      ]},
      { group: "SISTEM", label: "SISTEM", items: [
        { id: "employees", label: "Karyawan & Admin", icon: "shield" },
        { id: "audit-logs", label: "Audit Logs", icon: "activity" },
        { id: "settings", label: "Pengaturan", icon: "settings" },
        { id: "profile", label: "Profil Saya", icon: "user" }
      ]}
    ];

    const DEFAULT_AUTOVIA_CONFIG = {
      firebase: {
        apiKey: window.firebase?.apps?.[0]?.options?.apiKey || "",
        authDomain: window.firebase?.apps?.[0]?.options?.authDomain || "",
        projectId: window.firebase?.apps?.[0]?.options?.projectId || "",
        storageBucket: window.firebase?.apps?.[0]?.options?.storageBucket || "",
        messagingSenderId: window.firebase?.apps?.[0]?.options?.messagingSenderId || "",
        appId: window.firebase?.apps?.[0]?.options?.appId || ""
      },
      cloudinary: {
        cloudName: window.CLOUDINARY_CONFIG?.cloudName || "",
        uploadPreset: window.CLOUDINARY_CONFIG?.uploadPreset || "",
        folder: window.CLOUDINARY_CONFIG?.folder || "autovia",
        maxFileSizeMB: 4,
        allowedFormats: ["jpg", "jpeg", "png", "webp"]
      }
    };

    function initFirebaseServices(cfg) {
      try {
        if (window.auth && window.db) {
          return { connected: true, auth: window.auth, db: window.db, mode: "FIREBASE_CLOUD_LIVE" };
        }
        if (window.firebase && window.firebase.apps && window.firebase.apps.length > 0) {
          return { connected: true, auth: window.firebase.auth(), db: window.firebase.firestore(), mode: "FIREBASE_CLOUD_LIVE" };
        }
        if (!firebase.apps.length && cfg?.firebase?.apiKey) {
          firebase.initializeApp(cfg.firebase);
          return { connected: true, auth: firebase.auth(), db: firebase.firestore(), mode: "FIREBASE_CLOUD_LIVE" };
        }
        return { connected: false, auth: null, db: null, mode: "CONFIG_NOT_LOADED" };
      } catch (err) {
        console.error("Firebase init error:", err);
        return { connected: false, auth: null, db: null, mode: "FIREBASE_ERROR" };
      }
    }

    function mapFirebaseAuthError(err) {
      const code = err?.code || "";
      switch (code) {
        case "auth/user-not-found": return "Akun dengan email tersebut tidak ditemukan di Firebase Authentication.";
        case "auth/wrong-password": return "Kata sandi yang Anda masukkan salah.";
        case "auth/invalid-credential": case "auth/invalid-login-credentials": return "Email atau kata sandi tidak valid. Periksa kembali akun Anda.";
        case "auth/invalid-email": return "Format alamat email tidak valid.";
        case "auth/user-disabled": return "Akun ini telah dinonaktifkan pada Firebase Authentication.";
        case "auth/too-many-requests": return "Terlalu banyak percobaan login gagal. Silakan tunggu beberapa saat.";
        case "auth/network-request-failed": return "Koneksi jaringan bermasalah. Pastikan internet Anda aktif.";
        case "auth/requires-recent-login": return "Demi keamanan, silakan logout lalu login kembali sebelum mengubah kata sandi.";
        case "auth/email-already-in-use": return "Email tersebut sudah terdaftar di Firebase Authentication.";
        case "auth/weak-password": return "Kata sandi terlalu lemah. Minimal 6 karakter.";
        default: return err?.message || "Terjadi kesalahan saat proses autentikasi.";
      }
    }

    const formatIDR = (val) => {
      const num = Number(val) || 0;
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(num);
    };

    const formatCompactIDR = (val) => {
      const num = Number(val) || 0;
      if (Math.abs(num) >= 1_000_000_000) return `Rp ${(num / 1_000_000_000).toFixed(2)} M`;
      if (Math.abs(num) >= 1_000_000) return `Rp ${(num / 1_000_000).toFixed(1)} Jt`;
      return formatIDR(num);
    };

    const formatDateID = (dateStr) => {
      if (!dateStr) return "-";
      try {
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return dateStr;
        return new Intl.DateTimeFormat('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }).format(d);
      } catch { return dateStr; }
    };

    const todayISO = () => new Date().toISOString().split('T')[0];

    const Icon = ({ name, className = "w-4 h-4" }) => {
      const spanRef = useRef(null);
      useEffect(() => {
        if (spanRef.current && window.lucide) {
          spanRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
          window.lucide.createIcons({ root: spanRef.current });
        }
      }, [name, className]);
      return <span ref={spanRef} className="inline-flex items-center justify-center shrink-0" />;
    };

    const exportToExcel = (rows, fileName, sheetName = "AUTOVIA_Data") => {
      try {
        if (!rows || !rows.length) { Swal.fire("Info", "Tidak ada data untuk diexport.", "info"); return; }
        const ws = XLSX.utils.json_to_sheet(rows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, sheetName);
        XLSX.writeFile(wb, `${fileName}_${todayISO()}.xlsx`);
        Swal.fire({ icon: "success", title: "Export Excel Berhasil", text: `File ${fileName}_${todayISO()}.xlsx telah diunduh.`, timer: 1800, showConfirmButton: false });
      } catch (err) { Swal.fire("Error Export", err.message, "error"); }
    };

    const exportToPDF = (title, subtitle, columns, bodyRows, fileName) => {
      try {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: columns.length > 6 ? "landscape" : "portrait" });
        doc.setFillColor(11, 13, 18);
        doc.rect(0, 0, doc.internal.pageSize.getWidth(), 28, "F");
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(15);
        doc.setFont("helvetica", "bold");
        doc.text("AUTOVIA SHOWROOM MANAGEMENT", 14, 12);
        doc.setFontSize(10);
        doc.setFont("helvetica", "normal");
        doc.setTextColor(156, 163, 175);
        doc.text(`${title} — ${subtitle}`, 14, 20);
        doc.text(`Dicetak: ${formatDateID(todayISO())}`, doc.internal.pageSize.getWidth() - 52, 20);
        doc.autoTable({ startY: 34, head: [columns], body: bodyRows, theme: "grid", styles: { fontSize: 8, cellPadding: 3 }, headStyles: { fillColor: [37, 99, 235], textColor: [255, 255, 255], fontStyle: "bold" }, alternateRowStyles: { fillColor: [245, 247, 250] } });
        doc.save(`${fileName}_${todayISO()}.pdf`);
      } catch (err) { Swal.fire("Error PDF", err.message, "error"); }
    };

    const printDocumentReceipt = (title, docNo, date, partyLabel, partyName, items, summaryRows, notes = "") => {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.setFillColor(21, 25, 34);
      doc.rect(0, 0, 210, 36, "F");
      doc.setTextColor(255, 255, 255);
      doc.setFontSize(18);
      doc.setFont("helvetica", "bold");
      doc.text("AUTOVIA PREMIUM SHOWROOM", 14, 16);
      doc.setFontSize(10);
      doc.setFont("helvetica", "normal");
      doc.setTextColor(96, 165, 250);
      doc.text("Jl. Sultan Iskandar Muda No. 88, Jakarta Selatan | Telp: (021) 720-8899", 14, 24);
      doc.setTextColor(255, 255, 255);
      doc.setFontSize(12);
      doc.setFont("helvetica", "bold");
      doc.text(title.toUpperCase(), 145, 16);
      doc.setFontSize(9);
      doc.setFont("helvetica", "normal");
      doc.text(`No: ${docNo}`, 145, 23);
      doc.text(`Tgl: ${formatDateID(date)}`, 145, 29);
      doc.setTextColor(30, 30, 30);
      doc.setFontSize(10);
      doc.setFont("helvetica", "bold");
      doc.text(`${partyLabel}:`, 14, 46);
      doc.setFont("helvetica", "normal");
      doc.text(partyName || "-", 14, 52);
      doc.autoTable({ startY: 60, head: [["Deskripsi Item / Kendaraan", "Detail", "Nominal"]], body: items, theme: "striped", headStyles: { fillColor: [37, 99, 235] } });
      let finalY = doc.lastAutoTable.finalY + 10;
      summaryRows.forEach(([k, v]) => {
        doc.setFont("helvetica", "bold");
        doc.text(k, 120, finalY);
        doc.text(v, 195, finalY, { align: "right" });
        finalY += 7;
      });
      if (notes) {
        doc.setFont("helvetica", "italic");
        doc.setFontSize(9);
        doc.text(`Catatan: ${notes}`, 14, finalY + 6);
      }
      doc.save(`${docNo}.pdf`);
    };

    const EMPTY_OPERATIONAL_DATA = {
      settings: {
        showroomName: "AUTOVIA SHOWROOM", address: "", phone: "", email: "",
        currency: "IDR", timezone: "Asia/Jakarta", openingCashBalance: 0,
        brands: ["Toyota", "Honda", "BMW", "Mercedes-Benz", "Mitsubishi", "Hyundai", "Mazda", "Lexus", "Suzuki", "Daihatsu", "Wuling"],
        locations: ["Showroom Utama Lt. 1", "Showroom Utama Lt. 2", "Warehouse", "Bay Inspeksi & Detailing"],
        paymentMethods: [
          "Transfer Bank BCA", "Transfer Bank Mandiri", "Transfer Bank BRI", "Transfer Bank BNI",
          "Transfer Bank CIMB Niaga", "Transfer Bank Permata", "Transfer Bank Danamon", "Transfer Bank Syariah Indonesia (BSI)",
          "Tunai / Kas", "Leasing / Kredit", "Virtual Account", "QRIS (Scan QR Code)", "Kartu Kredit / Debit"
        ]
      },
      users: [], cars: [], purchases: [], inspections: [], maintenance: [],
      sales: [], payments: [], expenses: [], cashTransactions: [],
      suppliers: [], partners: [], customers: [], bookings: [],
      employees: [], tasks: [], documents: [],
      targets: { monthlySalesUnits: 10, monthlyRevenueTarget: 5000000000, monthlyProfitTarget: 400000000, monthlyPurchaseUnits: 10 },
      notifications: [], auditLogs: []
    };

    const FIRESTORE_COLLECTIONS = [
      "users", "cars", "purchases", "inspections", "maintenance",
      "sales", "payments", "expenses", "cashTransactions",
      "suppliers", "partners", "customers", "bookings",
      "employees", "tasks", "documents", "notifications", "auditLogs"
    ];

    const ChartCanvas = ({ type, data, options, height = 250 }) => {
      const canvasRef = useRef(null);
      const chartInstanceRef = useRef(null);
      useEffect(() => {
        if (!canvasRef.current || !window.Chart) return;
        if (chartInstanceRef.current) chartInstanceRef.current.destroy();
        const ctx = canvasRef.current.getContext("2d");
        chartInstanceRef.current = new Chart(ctx, {
          type, data,
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { labels: { color: "#9CA3AF", font: { family: "Plus Jakarta Sans", size: 11 } } } },
            scales: (type === "doughnut" || type === "pie") ? {} : {
              x: { ticks: { color: "#9CA3AF", font: { size: 11 } }, grid: { color: "rgba(38,45,61,0.4)" } },
              y: { ticks: { color: "#9CA3AF", font: { size: 11 } }, grid: { color: "rgba(38,45,61,0.4)" } }
            }, ...options
          }
        });
        return () => { if (chartInstanceRef.current) chartInstanceRef.current.destroy(); };
      }, [type, JSON.stringify(data)]);
      return <div style={{ height: `${height}px`, position: "relative", width: "100%" }}><canvas ref={canvasRef} /></div>;
    };

    const StatusBadge = ({ status }) => {
      const s = (status || "").toLowerCase();
      let cls = "bg-slate-500/15 text-slate-300 border-slate-500/30";
      if (["siap dijual", "lunas", "selesai", "baik", "aktif", "terkonfirmasi", "kas masuk"].some(k => s.includes(k))) {
        cls = "bg-emerald-500/15 text-emerald-400 border-emerald-500/30";
      } else if (["dibooking", "dp diterima", "dalam pengerjaan", "dalam inspeksi", "perlu perhatian", "terjadwal", "sedang dikerjakan", "menunggu"].some(k => s.includes(k))) {
        cls = "bg-amber-500/15 text-amber-400 border-amber-500/30";
      } else if (["terjual"].some(k => s === k)) {
        cls = "bg-blue-500/15 text-blue-400 border-blue-500/30";
      } else if (["dalam perbaikan", "belum lunas", "terlambat", "dibatalkan", "perlu perbaikan", "tidak aktif", "kas keluar", "belum dibayar"].some(k => s.includes(k))) {
        cls = "bg-rose-500/15 text-rose-400 border-rose-500/30";
      }
      return (
        <span className={`inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-semibold border ${cls}`}>
          <span className="w-1.5 h-1.5 rounded-full bg-current" />{status}
        </span>
      );
    };

    const Modal = ({ open, onClose, title, subtitle, maxWidth = "max-w-3xl", children }) => {
      if (!open) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/75 p-4 overflow-y-auto">
          <div className={`w-full ${maxWidth} bg-[#1B202B] border border-[#262D3D] rounded-2xl shadow-2xl overflow-hidden my-auto`}>
            <div className="flex items-center justify-between px-6 py-4 bg-[#151922] border-b border-[#262D3D]">
              <div>
                <h3 className="text-lg font-bold text-white">{title}</h3>
                {subtitle && <p className="text-xs text-[#9CA3AF] mt-0.5">{subtitle}</p>}
              </div>
              <button onClick={onClose} className="p-2 rounded-lg text-[#9CA3AF] hover:text-white hover:bg-[#262D3D] transition">
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>
            <div className="p-6 max-h-[82vh] overflow-y-auto">{children}</div>
          </div>
        </div>
      );
    };

    function App() {
      const [dbState, setDbState] = useState(EMPTY_OPERATIONAL_DATA);
      const [configObj, setConfigObj] = useState(DEFAULT_AUTOVIA_CONFIG);
      const fbService = useMemo(() => initFirebaseServices(configObj), [configObj]);

      const [currentUser, setCurrentUser] = useState(null);
      const [authChecking, setAuthChecking] = useState(true);

      const [loginEmail, setLoginEmail] = useState("");
      const [loginPassword, setLoginPassword] = useState("");
      const [showPassword, setShowPassword] = useState(false);
      const [loginLoading, setLoginLoading] = useState(false);
      const [loginError, setLoginError] = useState("");

      const [activePage, setActivePage] = useState("dashboard");
      const [sidebarOpen, setSidebarOpen] = useState(false);
      const [globalSearch, setGlobalSearch] = useState("");
      const [periodFilter, setPeriodFilter] = useState("Bulan Ini");
      const [customRange, setCustomRange] = useState({ start: todayISO(), end: todayISO() });

      useEffect(() => {
        if (!fbService.connected || !fbService.auth || !fbService.db) {
          setAuthChecking(false);
          setLoginError("File config.js belum terhubung atau Firebase gagal diinisialisasi.");
          return;
        }
        const unsubscribeAuth = fbService.auth.onAuthStateChanged(async (firebaseUser) => {
          if (!firebaseUser) {
            setCurrentUser(null);
            setAuthChecking(false);
            return;
          }
          try {
            const db = fbService.db;
            const userRef = db.collection("users").doc(firebaseUser.uid);
            const userSnap = await userRef.get();
            const nowStr = new Date().toLocaleString("id-ID");
            if (userSnap.exists) {
              const userData = userSnap.data();
              if (userData.status === "Tidak Aktif" || userData.active === false) {
                await fbService.auth.signOut();
                setCurrentUser(null);
                setLoginError("Akun Anda berstatus Nonaktif. Hubungi Super Admin.");
                setAuthChecking(false);
                return;
              }
              const activeProfile = {
                id: firebaseUser.uid, uid: firebaseUser.uid,
                name: userData.name || firebaseUser.displayName || firebaseUser.email.split("@")[0],
                email: firebaseUser.email, role: userData.role || "SUPER_ADMIN",
                status: "Aktif", active: true, lastLogin: nowStr
              };
              await userRef.set({ lastLogin: nowStr, email: firebaseUser.email }, { merge: true });
              setCurrentUser(activeProfile);
            } else {
              const existingUsersSnap = await db.collection("users").limit(1).get();
              const assignedRole = existingUsersSnap.empty ? "SUPER_ADMIN" : "SUPER_ADMIN";
              const newProfile = {
                id: firebaseUser.uid, uid: firebaseUser.uid,
                name: firebaseUser.displayName || firebaseUser.email.split("@")[0],
                email: firebaseUser.email, role: assignedRole,
                status: "Aktif", active: true, createdAt: nowStr, lastLogin: nowStr
              };
              await userRef.set(newProfile);
              setCurrentUser(newProfile);
            }
          } catch (err) {
            console.error("Gagal memuat profil pengguna dari Firestore:", err);
            setLoginError("Gagal memuat hak akses pengguna dari database: " + err.message);
          } finally {
            setAuthChecking(false);
          }
        });
        return () => unsubscribeAuth();
      }, [fbService]);

      const prevCollectionsRef = useRef({});
      const isRemoteSyncRef = useRef(false);

      useEffect(() => {
        if (!currentUser || !fbService.connected || !fbService.db) return;
        const db = fbService.db;
        const unsubscribers = [];
        unsubscribers.push(
          db.collection("system").doc("settings").onSnapshot((docSnap) => {
            if (docSnap.exists) {
              isRemoteSyncRef.current = true;
              setDbState(prev => ({ ...prev, settings: { ...prev.settings, ...docSnap.data() } }));
            }
          })
        );
        unsubscribers.push(
          db.collection("system").doc("targets").onSnapshot((docSnap) => {
            if (docSnap.exists) {
              isRemoteSyncRef.current = true;
              setDbState(prev => ({ ...prev, targets: { ...prev.targets, ...docSnap.data() } }));
            }
          })
        );
        FIRESTORE_COLLECTIONS.forEach((colName) => {
          const unsub = db.collection(colName).onSnapshot(
            (snapshot) => {
              const items = snapshot.docs.map(d => ({ ...d.data(), id: d.id }));
              prevCollectionsRef.current[colName] = new Map(items.map(i => [i.id, JSON.stringify(i)]));
              isRemoteSyncRef.current = true;
              setDbState(prev => ({ ...prev, [colName]: items }));
            },
            (err) => { console.warn(`Firestore listener (${colName}):`, err.message); }
          );
          unsubscribers.push(unsub);
        });
        return () => unsubscribers.forEach(u => u());
      }, [currentUser, fbService]);

      useEffect(() => {
        if (!currentUser || !fbService.connected || !fbService.db) return;
        if (isRemoteSyncRef.current) {
          isRemoteSyncRef.current = false;
          return;
        }
        const db = fbService.db;
        db.collection("system").doc("settings").set(dbState.settings || {}, { merge: true }).catch(() => {});
        db.collection("system").doc("targets").set(dbState.targets || {}, { merge: true }).catch(() => {});
        FIRESTORE_COLLECTIONS.forEach((colName) => {
          const currentArr = dbState[colName] || [];
          const prevMap = prevCollectionsRef.current[colName] || new Map();
          const nextMap = new Map();
          currentArr.forEach((item) => {
            if (!item || !item.id) return;
            const serialized = JSON.stringify(item);
            nextMap.set(item.id, serialized);
            if (prevMap.get(item.id) !== serialized) {
              db.collection(colName).doc(String(item.id)).set(item, { merge: true }).catch(err => {
                console.error(`Firestore write error (${colName}/${item.id}):`, err);
              });
            }
          });
          prevMap.forEach((_, oldId) => {
            if (!nextMap.has(oldId)) {
              db.collection(colName).doc(String(oldId)).delete().catch(err => {
                console.error(`Firestore delete error (${colName}/${oldId}):`, err);
              });
            }
          });
          prevCollectionsRef.current[colName] = nextMap;
        });
      }, [dbState, currentUser, fbService]);

      const appendAuditLog = useCallback((moduleName, actionText, targetId = "-") => {
        const actor = currentUser || { name: "System", role: "SUPER_ADMIN" };
        const entry = {
          id: `LOG-${Date.now().toString().slice(-6)}`,
          user: actor.name, role: actor.role, module: moduleName,
          action: actionText, target: targetId, timestamp: new Date().toLocaleString("id-ID")
        };
        setDbState(prev => ({ ...prev, auditLogs: [entry, ...(prev.auditLogs || []).slice(0, 199)] }));
      }, [currentUser]);

      const pushNotification = useCallback((title, message, targetPage = "dashboard") => {
        const item = {
          id: `NTF-${Date.now().toString().slice(-6)}`, title, message,
          time: new Date().toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" }),
          read: false, targetPage
        };
        setDbState(prev => ({ ...prev, notifications: [item, ...(prev.notifications || [])] }));
      }, []);

      const handleLogin = async (e) => {
        e.preventDefault();
        setLoginError("");
        if (!loginEmail || !loginPassword) {
          setLoginError("Email dan kata sandi wajib diisi.");
          return;
        }
        if (!fbService.connected || !fbService.auth) {
          setLoginError("Firebase Authentication belum terhubung. Pastikan file config.js berada di folder yang sama.");
          return;
        }
        setLoginLoading(true);
        try {
          const cred = await fbService.auth.signInWithEmailAndPassword(loginEmail.trim(), loginPassword);
          if (cred?.user && fbService.db) {
            await fbService.db.collection("auditLogs").doc(`LOG-${Date.now()}`).set({
              id: `LOG-${Date.now()}`, user: cred.user.displayName || cred.user.email,
              role: "AUTH", module: "Autentikasi",
              action: "Login berhasil melalui Firebase Authentication",
              target: cred.user.email, timestamp: new Date().toLocaleString("id-ID")
            });
          }
        } catch (err) {
          setLoginError(mapFirebaseAuthError(err));
        } finally {
          setLoginLoading(false);
        }
      };

      const handleLogout = async () => {
        appendAuditLog("Autentikasi", "Logout dari sistem", currentUser?.email || "-");
        if (fbService.connected && fbService.auth) {
          try { await fbService.auth.signOut(); } catch (err) { console.error("Logout error:", err); }
        }
        setCurrentUser(null);
      };

      const metrics = useMemo(() => {
        const cars = dbState.cars || [];
        const sales = dbState.sales || [];
        const purchases = dbState.purchases || [];
        const expenses = dbState.expenses || [];
        const cashTx = dbState.cashTransactions || [];

        const totalCars = cars.length;
        const readyCars = cars.filter(c => c.status === "Siap Dijual").length;
        const inspectingCars = cars.filter(c => ["Menunggu Inspeksi", "Dalam Inspeksi"].includes(c.status)).length;
        const repairingCars = cars.filter(c => ["Menunggu Perbaikan", "Dalam Perbaikan"].includes(c.status)).length;
        const bookedCars = cars.filter(c => c.status === "Dibooking").length;
        const soldCars = cars.filter(c => c.status === "Terjual").length;
        const availableCars = cars.filter(c => !["Terjual", "Tidak Aktif"].includes(c.status)).length;

        const inventoryCapital = cars.filter(c => c.status !== "Terjual").reduce((acc, c) => acc + (Number(c.buyPrice) || 0) + (Number(c.extraCost) || 0), 0);
        const validSales = sales.filter(s => s.status !== "Dibatalkan");
        const completedSales = sales.filter(s => s.status === "Lunas");
        const totalRevenue = validSales.reduce((acc, s) => acc + (Number(s.totalTransaction) || 0), 0);

        const totalProfit = validSales.reduce((acc, s) => {
          const car = cars.find(c => c.id === s.carId);
          const capital = car ? (Number(car.buyPrice) + Number(car.extraCost)) : 0;
          const gross = (Number(s.totalTransaction) || 0) - capital;
          return acc + (gross - (Number(s.sellingExpense) || 0));
        }, 0);

        const totalPurchasesAmount = purchases.filter(p => p.status !== "Dibatalkan").reduce((acc, p) => acc + (Number(p.totalPurchase) || 0), 0);
        const totalExpenses = expenses.reduce((acc, e) => acc + (Number(e.amount) || 0), 0);
        const totalReceivables = validSales.reduce((acc, s) => acc + (Number(s.remainingAmount) || 0), 0);
        const totalPayables = purchases.filter(p => p.status !== "Dibatalkan").reduce((acc, p) => acc + (Number(p.remainingAmount) || 0), 0);

        const cashIn = cashTx.filter(t => t.type === "Kas Masuk").reduce((acc, t) => acc + (Number(t.amount) || 0), 0);
        const cashOut = cashTx.filter(t => t.type === "Kas Keluar").reduce((acc, t) => acc + (Number(t.amount) || 0), 0);
        const openingBalance = Number(dbState.settings?.openingCashBalance) || 0;
        const currentCashBalance = openingBalance + cashIn - cashOut;

        return {
          totalCars, availableCars, inspectingCars, repairingCars, readyCars, bookedCars, soldCars,
          totalPurchasesCount: purchases.length, totalPurchasesAmount,
          totalSalesCount: validSales.length, completedSalesCount: completedSales.length,
          totalCustomers: (dbState.customers || []).length,
          totalSuppliers: (dbState.suppliers || []).length,
          totalTransactions: validSales.length + purchases.length,
          totalRevenue, inventoryCapital, totalProfit, totalExpenses, totalReceivables, totalPayables,
          cashIn, cashOut, openingBalance, currentCashBalance
        };
      }, [dbState]);

      if (authChecking) {
        return (
          <div className="min-h-screen bg-[#0B0D12] flex flex-col items-center justify-center p-4 text-center">
            <div className="w-12 h-12 rounded-2xl bg-[#2563EB] flex items-center justify-center overflow-hidden mb-4 animate-pulse">
            <img src="Autovia.jpg" alt="Logo" className="w-full h-full object-cover" />
            </div>
            <div className="text-sm font-bold text-white">Memverifikasi Sesi Firebase Authentication...</div>
            <div className="text-xs text-[#9CA3AF] mt-1">Menghubungkan ke project {configObj?.firebase?.projectId || "autovia-car"}</div>
          </div>
        );
      }

      if (!currentUser) {
        return (
          <div className="min-h-screen bg-[#0B0D12] flex items-center justify-center p-4">
            <div className="w-full max-w-5xl grid grid-cols-1 lg:grid-cols-12 bg-[#151922] border border-[#262D3D] rounded-2xl overflow-hidden shadow-2xl">
              <div className="lg:col-span-5 bg-[#1B202B] p-8 flex flex-col justify-between border-b lg:border-b-0 lg:border-r border-[#262D3D]">
                <div>
                  <div className="flex items-center gap-3 mb-8">
                    <div className="w-11 h-11 rounded-xl bg-[#2563EB] flex items-center justify-center overflow-hidden">
                    <img src="Autovia.jpg" alt="Logo" className="w-full h-full object-cover" />
                    </div>
                    <div>
                      <h1 className="text-xl font-extrabold tracking-tight text-white">AUTOVIA</h1>
                      <p className="text-xs text-[#60A5FA] font-medium">Enterprise Showroom ERP</p>
                    </div>
                  </div>
                  <h2 className="text-2xl font-bold text-white leading-snug mb-3">Sistem Manajemen Operasional Showroom Terpadu</h2>
                  <p className="text-sm text-[#9CA3AF] leading-relaxed">
                    Akses terbatas khusus internal manajemen, admin inventaris, keuangan, dan staf penjualan. Seluruh aktivitas diaudit secara real-time.
                  </p>
                </div>
              </div>

              <div className="lg:col-span-7 p-8 lg:p-12 flex flex-col justify-center">
                <div className="max-w-md w-full mx-auto">
                  <span className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-[#2563EB]/15 text-[#60A5FA] text-xs font-semibold mb-4">
                    <Icon name="lock" className="w-3.5 h-3.5" /> Portal Autentikasi Internal
                  </span>
                  <h3 className="text-2xl font-bold text-white mb-1">Masuk ke AUTOVIA</h3>
                  <p className="text-sm text-[#9CA3AF] mb-6">Masukkan email dan kata sandi akun Firebase Authentication Anda.</p>

                  {loginError && (
                    <div className="mb-4 p-3.5 rounded-xl bg-[#EF4444]/15 border border-[#EF4444]/40 text-sm text-[#EF4444] flex items-start gap-2.5">
                      <Icon name="alert-circle" className="w-4 h-4 mt-0.5 shrink-0" />
                      <span>{loginError}</span>
                    </div>
                  )}

                  <form onSubmit={handleLogin} className="space-y-4">
                    <div>
                      <label className="block text-xs font-semibold text-[#9CA3AF] uppercase tracking-wider mb-1.5">Email Terdaftar</label>
                      <input type="email" required autoComplete="email" value={loginEmail} onChange={(e) => setLoginEmail(e.target.value)} placeholder="admin@autovia.com" className="w-full px-4 py-3 rounded-xl bg-[#0B0D12] border border-[#262D3D] text-white text-sm focus:outline-none focus:border-[#2563EB]" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-[#9CA3AF] uppercase tracking-wider mb-1.5">Kata Sandi</label>
                      <div className="relative">
                        <input type={showPassword ? "text" : "password"} required autoComplete="current-password" value={loginPassword} onChange={(e) => setLoginPassword(e.target.value)} placeholder="Masukkan kata sandi" className="w-full px-4 py-3 rounded-xl bg-[#0B0D12] border border-[#262D3D] text-white text-sm focus:outline-none focus:border-[#2563EB] pr-11" />
                        <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute right-3 top-1/2 -translate-y-1/2 text-[#9CA3AF] hover:text-white p-1">
                          <Icon name={showPassword ? "eye-off" : "eye"} className="w-4 h-4" />
                        </button>
                      </div>
                    </div>
                    <button type="submit" disabled={loginLoading || !fbService.connected} className="w-full py-3.5 px-4 rounded-xl bg-[#2563EB] hover:bg-blue-600 text-white font-semibold text-sm transition flex items-center justify-center gap-2 disabled:opacity-50">
                      {loginLoading ? (<><Icon name="loader-2" className="w-4 h-4 animate-spin" /> Memverifikasi Akun Firebase...</>) : (<><Icon name="log-in" className="w-4 h-4" /> Masuk ke Dashboard Operasional</>)}
                    </button>
                  </form>

                  <div className="mt-8 pt-6 border-t border-[#262D3D] flex items-center justify-between text-xs text-[#9CA3AF]">
                    <span>AUTOVIA Enterprise v2.6</span>
                    <span>Zona Waktu: Asia/Jakarta (WIB)</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      }

      const userRoleSpec = ROLES[currentUser.role] || ROLES.SALES;
      const allowedNavGroups = SIDEBAR_GROUPS.filter(g => userRoleSpec.allowedSections.includes(g.group));
      const unreadNotifCount = (dbState.notifications || []).filter(n => !n.read).length;
      const activeNavItem = SIDEBAR_GROUPS.flatMap(g => g.items).find(i => i.id === activePage) || { label: "Dashboard" };
      const activeNavGroup = SIDEBAR_GROUPS.find(g => g.items.some(i => i.id === activePage)) || { label: "OVERVIEW" };

      return (
        <div className="h-screen w-full bg-[#0B0D12] text-white flex overflow-hidden">
          {sidebarOpen && <div onClick={() => setSidebarOpen(false)} className="fixed inset-0 z-30 bg-black/70 lg:hidden" />}

          <aside className={`fixed lg:static inset-y-0 left-0 z-40 w-72 bg-[#151922] border-r border-[#262D3D] flex flex-col transition-transform duration-200 h-full shrink-0 ${sidebarOpen ? "translate-x-0" : "-translate-x-full lg:translate-x-0"}`}>
            <div className="h-16 px-5 flex items-center justify-between border-b border-[#262D3D] shrink-0">
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-xl bg-[#2563EB] flex items-center justify-center overflow-hidden">
                <img src="Autovia.jpg" alt="Logo" className="w-full h-full object-cover" />
                </div>
                <div>
                  <div className="font-extrabold text-base tracking-tight text-white">AUTOVIA</div>
                  <div className="text-[11px] text-[#60A5FA] font-medium">Showroom ERP System</div>
                </div>
              </div>
              <button onClick={() => setSidebarOpen(false)} className="lg:hidden p-1.5 text-[#9CA3AF] hover:text-white"><Icon name="x" className="w-5 h-5" /></button>
            </div>

            <div className="px-4 py-3 border-b border-[#262D3D] bg-[#1B202B]/50 shrink-0">
              <div className="flex items-center justify-between">
                <span className="text-[11px] text-[#9CA3AF] font-medium">Akses Aktif</span>
                <span className={`text-[10px] px-2 py-0.5 rounded-full border font-semibold ${userRoleSpec.badgeColor}`}>{currentUser.role}</span>
              </div>
              <div className="text-sm font-bold text-white mt-1 truncate">{currentUser.name}</div>
            </div>

            <nav className="flex-1 overflow-y-auto px-3 py-4 space-y-5">
              {allowedNavGroups.map((grp) => (
                <div key={grp.group}>
                  <div className="px-3 mb-1.5 text-[10px] font-bold tracking-widest text-[#9CA3AF] uppercase">{grp.label}</div>
                  <div className="space-y-0.5">
                    {grp.items.map((item) => {
                      const isActive = activePage === item.id;
                      return (
                        <button key={item.id} onClick={() => { setActivePage(item.id); setSidebarOpen(false); }}
                          className={`w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium transition ${isActive ? "bg-[#2563EB] text-white font-semibold" : "text-[#9CA3AF] hover:text-white hover:bg-[#1B202B]"}`}>
                          <span className="flex items-center gap-3"><Icon name={item.icon} className="w-4 h-4" /><span>{item.label}</span></span>
                          {item.id === "notifications" && unreadNotifCount > 0 && (<span className="px-1.5 py-0.5 text-[10px] font-bold rounded-full bg-[#EF4444] text-white">{unreadNotifCount}</span>)}
                          {item.id === "receivables" && metrics.totalReceivables > 0 && (<span className="w-2 h-2 rounded-full bg-[#F59E0B]" />)}
                        </button>
                      );
                    })}
                  </div>
                </div>
              ))}
              <div className="pt-2 border-t border-[#262D3D]">
                <button onClick={handleLogout} className="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-[#EF4444] hover:bg-[#EF4444]/10 transition">
                  <Icon name="log-out" className="w-4 h-4" /><span>Logout Sistem</span>
                </button>
              </div>
            </nav>
          </aside>

          <div className="flex-1 flex flex-col min-w-0 h-full overflow-hidden">
            <header className="h-16 bg-[#151922] border-b border-[#262D3D] px-4 lg:px-8 flex items-center justify-between gap-4 shrink-0">
              <div className="flex items-center gap-3 min-w-0">
                <button onClick={() => setSidebarOpen(true)} className="lg:hidden p-2 rounded-xl bg-[#1B202B] border border-[#262D3D] text-white"><Icon name="menu" className="w-5 h-5" /></button>
                <div className="truncate">
                  <div className="flex items-center gap-1.5 text-xs text-[#9CA3AF]"><span>AUTOVIA</span><span>/</span><span>{activeNavGroup.label}</span></div>
                  <h2 className="text-base lg:text-lg font-bold text-white truncate">{activeNavItem.label}</h2>
                </div>
              </div>

              <div className="flex items-center gap-2.5 lg:gap-3">
                <div className="hidden md:flex items-center bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2 w-64">
                  <Icon name="search" className="w-4 h-4 text-[#9CA3AF] mr-2" />
                  <input type="text" value={globalSearch} onChange={(e) => setGlobalSearch(e.target.value)} placeholder="Cari plat, unit, pelanggan..." className="bg-transparent text-xs text-white placeholder-[#9CA3AF] focus:outline-none w-full" />
                </div>
                <button onClick={() => setActivePage("settings")} title="Status Integrasi Firebase & Cloudinary" className="hidden sm:flex items-center gap-2 px-3 py-2 rounded-xl bg-[#1B202B] border border-[#262D3D] text-xs font-medium hover:border-[#2563EB] transition">
                  <span className={`w-2 h-2 rounded-full ${fbService.connected ? "bg-[#22C55E]" : "bg-[#60A5FA]"}`} />
                  <span className="text-[#9CA3AF]">{fbService.connected ? "Cloud Live" : "Local Sync"}</span>
                </button>
                <button onClick={() => setActivePage("notifications")} className="relative p-2.5 rounded-xl bg-[#1B202B] border border-[#262D3D] text-[#9CA3AF] hover:text-white transition">
                  <Icon name="bell" className="w-4 h-4" />
                  {unreadNotifCount > 0 && (<span className="absolute -top-1 -right-1 w-4 h-4 rounded-full bg-[#EF4444] text-[10px] font-bold text-white flex items-center justify-center">{unreadNotifCount}</span>)}
                </button>
                <button onClick={() => setActivePage("profile")} className="flex items-center gap-2.5 pl-2 pr-3 py-1.5 rounded-xl bg-[#1B202B] border border-[#262D3D] hover:border-[#2563EB] transition">
                  <div className="w-7 h-7 rounded-lg bg-[#2563EB] flex items-center justify-center text-xs font-bold text-white">{currentUser.name.charAt(0)}</div>
                  <div className="hidden xl:block text-left">
                    <div className="text-xs font-semibold text-white leading-tight">{currentUser.name}</div>
                    <div className="text-[10px] text-[#9CA3AF]">{userRoleSpec.label}</div>
                  </div>
                </button>
              </div>
            </header>

            <main className="flex-1 overflow-y-auto p-4 lg:p-8 w-full">
              <div className="max-w-[1600px] mx-auto space-y-6">
                {activePage === "dashboard" && (<DashboardModule dbState={dbState} metrics={metrics} periodFilter={periodFilter} setPeriodFilter={setPeriodFilter} customRange={customRange} setCustomRange={setCustomRange} setActivePage={setActivePage} />)}
                {(activePage === "cars" || activePage === "cars-add" || activePage === "car-history") && (<InventoryModule dbState={dbState} setDbState={setDbState} initialOpenAdd={activePage === "cars-add"} initialTab={activePage === "car-history" ? "history" : "list"} currentUser={currentUser} userRoleSpec={userRoleSpec} configObj={configObj} appendAuditLog={appendAuditLog} pushNotification={pushNotification} globalSearch={globalSearch} />)}
                {activePage === "purchases" && (<PurchasesModule dbState={dbState} setDbState={setDbState} currentUser={currentUser} appendAuditLog={appendAuditLog} pushNotification={pushNotification} />)}
                {activePage === "inspections" && (<InspectionsModule dbState={dbState} setDbState={setDbState} currentUser={currentUser} appendAuditLog={appendAuditLog} />)}
                {activePage === "maintenance" && (<MaintenanceModule dbState={dbState} setDbState={setDbState} currentUser={currentUser} appendAuditLog={appendAuditLog} />)}
                {(activePage === "sales" || activePage === "tx-history") && (<SalesModule dbState={dbState} setDbState={setDbState} currentUser={currentUser} appendAuditLog={appendAuditLog} pushNotification={pushNotification} />)}
                {(activePage === "payments" || activePage === "receivables") && (<PaymentsReceivablesModule dbState={dbState} setDbState={setDbState} defaultTab={activePage === "receivables" ? "receivables" : "payments"} appendAuditLog={appendAuditLog} pushNotification={pushNotification} />)}
                {(activePage === "cash-bank" || activePage === "cash-in" || activePage === "cash-out") && (<CashFinanceModule dbState={dbState} setDbState={setDbState} metrics={metrics} filterType={activePage === "cash-in" ? "Kas Masuk" : activePage === "cash-out" ? "Kas Keluar" : "Semua"} appendAuditLog={appendAuditLog} />)}
                {activePage === "expenses" && (<ExpensesModule dbState={dbState} setDbState={setDbState} currentUser={currentUser} appendAuditLog={appendAuditLog} />)}
                {(activePage === "suppliers" || activePage === "payables" || activePage === "partners") && (<PartnersSuppliersModule dbState={dbState} setDbState={setDbState} defaultTab={activePage === "payables" ? "payables" : activePage === "partners" ? "partners" : "suppliers"} appendAuditLog={appendAuditLog} />)}
                {activePage === "customers" && (<CustomersModule dbState={dbState} setDbState={setDbState} appendAuditLog={appendAuditLog} />)}
                {(activePage === "bookings" || activePage === "calendar") && (<BookingsModule dbState={dbState} setDbState={setDbState} currentUser={currentUser} defaultView={activePage === "calendar" ? "calendar" : "list"} appendAuditLog={appendAuditLog} pushNotification={pushNotification} />)}
                {(activePage === "tasks" || activePage === "reminders") && (<TasksModule dbState={dbState} setDbState={setDbState} currentUser={currentUser} appendAuditLog={appendAuditLog} pushNotification={pushNotification} />)}
                {activePage === "documents" && (<DocumentsModule dbState={dbState} setDbState={setDbState} currentUser={currentUser} appendAuditLog={appendAuditLog} />)}
                {(activePage === "finance-report" || activePage === "report-inventory" || activePage === "report-purchase" || activePage === "report-sales" || activePage === "targets") && (<ReportsAnalyticsModule dbState={dbState} setDbState={setDbState} metrics={metrics} initialTab={activePage} userRoleSpec={userRoleSpec} appendAuditLog={appendAuditLog} />)}
                {(activePage === "employees" || activePage === "admins") && (<EmployeesAdminsModule dbState={dbState} setDbState={setDbState} initialTab={activePage === "admins" ? "admins" : "employees"} userRoleSpec={userRoleSpec} appendAuditLog={appendAuditLog} fbService={fbService} />)}
                {activePage === "notifications" && (<NotificationsModule dbState={dbState} setDbState={setDbState} setActivePage={setActivePage} />)}
                {activePage === "audit-logs" && (<AuditLogsModule dbState={dbState} />)}
                {activePage === "backup" && (<BackupRestoreModule dbState={dbState} setDbState={setDbState} appendAuditLog={appendAuditLog} />)}
                {activePage === "settings" && (<SettingsModule dbState={dbState} setDbState={setDbState} configObj={configObj} setConfigObj={setConfigObj} fbService={fbService} appendAuditLog={appendAuditLog} />)}
                {activePage === "profile" && (<ProfileModule currentUser={currentUser} setCurrentUser={setCurrentUser} dbState={dbState} setDbState={setDbState} fbService={fbService} appendAuditLog={appendAuditLog} />)}
              </div>
            </main>
          </div>
        </div>
      );
    }

    function DashboardModule({ dbState, metrics, periodFilter, setPeriodFilter, customRange, setCustomRange, setActivePage }) {
      const periods = ["Hari Ini", "Kemarin", "7 Hari Terakhir", "30 Hari Terakhir", "Bulan Ini", "Bulan Sebelumnya", "Tahun Ini", "Rentang Khusus"];

      const brandStats = useMemo(() => {
        const map = {};
        (dbState.cars || []).forEach(c => { map[c.brand] = (map[c.brand] || 0) + 1; });
        return {
          labels: Object.keys(map),
          datasets: [{ label: "Unit Kendaraan", data: Object.values(map), backgroundColor: ["#2563EB", "#22C55E", "#F59E0B", "#60A5FA", "#A855F7", "#EC4899"] }]
        };
      }, [dbState.cars]);

      const statusStats = useMemo(() => {
        const statuses = ["Siap Dijual", "Dibooking", "Dalam Inspeksi", "Dalam Perbaikan", "Terjual"];
        return {
          labels: statuses,
          datasets: [{ label: "Jumlah Unit", data: statuses.map(st => (dbState.cars || []).filter(c => c.status === st).length), backgroundColor: ["#22C55E", "#F59E0B", "#60A5FA", "#EF4444", "#2563EB"], borderWidth: 0 }]
        };
      }, [dbState.cars]);

      const monthlyComparisonData = {
        labels: ["Jun", "Jul", "Agu", "Sep", "Okt", "Nov"],
        datasets: [
          { label: "Penjualan (Juta Rp)", data: [1420, 1890, 1650, 2120, 1980, Math.round(metrics.totalRevenue / 1000000)], borderColor: "#2563EB", backgroundColor: "rgba(37, 99, 235, 0.2)", tension: 0.35, fill: true },
          { label: "Pembelian (Juta Rp)", data: [1100, 1450, 1320, 1780, 1510, Math.round(metrics.totalPurchasesAmount / 1000000)], borderColor: "#F59E0B", backgroundColor: "rgba(245, 158, 11, 0.15)", tension: 0.35, fill: true }
        ]
      };

      const cashflowChartData = {
        labels: ["Kas Masuk", "Kas Keluar", "Keuntungan Bersih", "Pengeluaran Ops"],
        datasets: [{
          label: "Nominal (Juta Rp)",
          data: [Math.round(metrics.cashIn / 1000000), Math.round(metrics.cashOut / 1000000), Math.round(metrics.totalProfit / 1000000), Math.round(metrics.totalExpenses / 1000000)],
          backgroundColor: ["#22C55E", "#EF4444", "#2563EB", "#F59E0B"], borderRadius: 8
        }]
      };

      const salesByStaffData = useMemo(() => {
        const map = {};
        (dbState.sales || []).filter(s => s.status !== "Dibatalkan").forEach(s => {
          map[s.salesStaff] = (map[s.salesStaff] || 0) + (Number(s.totalTransaction) || 0) / 1000000;
        });
        return {
          labels: Object.keys(map).length ? Object.keys(map) : ["Budi Santoso"],
          datasets: [{ label: "Omzet Staf (Juta Rp)", data: Object.keys(map).length ? Object.values(map) : [0], backgroundColor: "#60A5FA", borderRadius: 8 }]
        };
      }, [dbState.sales]);

      const kpiCards = [
        { label: "Total Kendaraan", value: `${metrics.totalCars} Unit`, sub: `${metrics.availableCars} Aktif di Showroom`, icon: "car", color: "text-[#60A5FA]" },
        { label: "Siap Dijual", value: `${metrics.readyCars} Unit`, sub: `${metrics.bookedCars} Unit Dibooking`, icon: "check-circle-2", color: "text-[#22C55E]" },
        { label: "Inspeksi & Perbaikan", value: `${metrics.inspectingCars + metrics.repairingCars} Unit`, sub: `${metrics.inspectingCars} Inspeksi • ${metrics.repairingCars} Perbaikan`, icon: "wrench", color: "text-[#F59E0B]" },
        { label: "Kendaraan Terjual", value: `${metrics.soldCars} Unit`, sub: `${metrics.totalSalesCount} Transaksi Penjualan`, icon: "award", color: "text-[#2563EB]" },
        { label: "Total Omzet Penjualan", value: formatCompactIDR(metrics.totalRevenue), sub: formatIDR(metrics.totalRevenue), icon: "trending-up", color: "text-[#22C55E]" },
        { label: "Total Modal Inventaris", value: formatCompactIDR(metrics.inventoryCapital), sub: "Unit stok aktif saat ini", icon: "layers", color: "text-[#60A5FA]" },
        { label: "Estimasi Keuntungan", value: formatCompactIDR(metrics.totalProfit), sub: "Akumulasi profit bersih", icon: "badge-dollar-sign", color: "text-[#22C55E]" },
        { label: "Saldo Kas & Bank", value: formatCompactIDR(metrics.currentCashBalance), sub: `Masuk: ${formatCompactIDR(metrics.cashIn)}`, icon: "landmark", color: "text-white" },
        { label: "Total Piutang Pelanggan", value: formatCompactIDR(metrics.totalReceivables), sub: "Tagihan belum lunas", icon: "clock-alert", color: "text-[#F59E0B]" },
        { label: "Total Utang Supplier", value: formatCompactIDR(metrics.totalPayables), sub: `${metrics.totalSuppliers} Supplier terdaftar`, icon: "file-warning", color: "text-[#EF4444]" },
        { label: "Pengeluaran Operasional", value: formatCompactIDR(metrics.totalExpenses), sub: `Kas Keluar: ${formatCompactIDR(metrics.cashOut)}`, icon: "wallet", color: "text-[#EF4444]" },
        { label: "Database Pelanggan", value: `${metrics.totalCustomers} Klien`, sub: `${metrics.totalTransactions} Total Transaksi`, icon: "users", color: "text-[#60A5FA]" }
      ];

      return (
        <div className="space-y-6">
          <div className="bg-[#151922] border border-[#262D3D] rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3">
            <div>
              <h3 className="text-sm font-bold text-white">Ringkasan Operasional & Finansial</h3>
              <p className="text-xs text-[#9CA3AF]">Data tersinkronisasi langsung dengan modul inventaris, transaksi, dan kas.</p>
            </div>
            <div className="flex flex-wrap items-center gap-2">
              {periods.map(p => (
                <button key={p} onClick={() => setPeriodFilter(p)} className={`px-3 py-1.5 rounded-xl text-xs font-semibold transition ${periodFilter === p ? "bg-[#2563EB] text-white" : "bg-[#1B202B] text-[#9CA3AF] hover:text-white border border-[#262D3D]"}`}>{p}</button>
              ))}
              {periodFilter === "Rentang Khusus" && (
                <div className="flex items-center gap-2">
                  <input type="date" value={customRange.start} onChange={(e) => setCustomRange({ ...customRange, start: e.target.value })} className="bg-[#0B0D12] border border-[#262D3D] rounded-lg px-2.5 py-1 text-xs text-white" />
                  <span className="text-xs text-[#9CA3AF]">s/d</span>
                  <input type="date" value={customRange.end} onChange={(e) => setCustomRange({ ...customRange, end: e.target.value })} className="bg-[#0B0D12] border border-[#262D3D] rounded-lg px-2.5 py-1 text-xs text-white" />
                </div>
              )}
            </div>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            {kpiCards.map((kpi, idx) => (
              <div key={idx} className="bg-[#1B202B] border border-[#262D3D] rounded-2xl p-5 hover:border-[#2563EB]/60 transition">
                <div className="flex items-center justify-between mb-3">
                  <span className="text-xs font-semibold text-[#9CA3AF]">{kpi.label}</span>
                  <div className={`p-2 rounded-xl bg-[#151922] border border-[#262D3D] ${kpi.color}`}><Icon name={kpi.icon} className="w-4 h-4" /></div>
                </div>
                <div className="text-xl lg:text-2xl font-extrabold text-white tracking-tight">{kpi.value}</div>
                <div className="text-xs text-[#9CA3AF] mt-1 truncate">{kpi.sub}</div>
              </div>
            ))}
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div className="lg:col-span-8 bg-[#1B202B] border border-[#262D3D] rounded-2xl p-5">
              <div className="flex items-center justify-between mb-4">
                <div>
                  <h4 className="text-sm font-bold text-white">Perbandingan Pembelian & Penjualan Bulanan</h4>
                  <p className="text-xs text-[#9CA3AF]">Tren nilai transaksi dalam Juta Rupiah</p>
                </div>
                <span className="text-xs px-2.5 py-1 rounded-lg bg-[#151922] text-[#60A5FA] border border-[#262D3D]">{periodFilter}</span>
              </div>
              <ChartCanvas type="line" data={monthlyComparisonData} height={260} />
            </div>
            <div className="lg:col-span-4 bg-[#1B202B] border border-[#262D3D] rounded-2xl p-5">
              <h4 className="text-sm font-bold text-white mb-1">Status Unit Kendaraan</h4>
              <p className="text-xs text-[#9CA3AF] mb-4">Distribusi siklus operasional unit</p>
              <ChartCanvas type="doughnut" data={statusStats} height={260} />
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="bg-[#1B202B] border border-[#262D3D] rounded-2xl p-5">
              <h4 className="text-sm font-bold text-white mb-1">Arus Kas & Profitabilitas</h4>
              <p className="text-xs text-[#9CA3AF] mb-4">Ringkasan Kas Masuk, Keluar & Laba (Juta Rp)</p>
              <ChartCanvas type="bar" data={cashflowChartData} height={220} />
            </div>
            <div className="bg-[#1B202B] border border-[#262D3D] rounded-2xl p-5">
              <h4 className="text-sm font-bold text-white mb-1">Stok Berdasarkan Merek</h4>
              <p className="text-xs text-[#9CA3AF] mb-4">Komposisi merek unit dalam database</p>
              <ChartCanvas type="bar" data={brandStats} height={220} />
            </div>
            <div className="bg-[#1B202B] border border-[#262D3D] rounded-2xl p-5">
              <h4 className="text-sm font-bold text-white mb-1">Penjualan Berdasarkan Staf</h4>
              <p className="text-xs text-[#9CA3AF] mb-4">Kontribusi omzet per eksekutif penjualan</p>
              <ChartCanvas type="bar" data={salesByStaffData} height={220} />
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div className="bg-[#1B202B] border border-[#262D3D] rounded-2xl p-5">
              <div className="flex items-center justify-between mb-4">
                <h4 className="text-sm font-bold text-white">Aktivitas Terbaru Showroom</h4>
                <button onClick={() => setActivePage("audit-logs")} className="text-xs text-[#60A5FA] hover:underline">Lihat Semua Log</button>
              </div>
              <div className="space-y-3">
                {(dbState.auditLogs || []).slice(0, 6).map(log => (
                  <div key={log.id} className="flex items-start justify-between gap-3 p-3 rounded-xl bg-[#151922] border border-[#262D3D]">
                    <div className="flex items-start gap-3">
                      <div className="p-2 rounded-lg bg-[#2563EB]/15 text-[#60A5FA] mt-0.5"><Icon name="activity" className="w-3.5 h-3.5" /></div>
                      <div>
                        <div className="text-xs font-semibold text-white">{log.action}</div>
                        <div className="text-[11px] text-[#9CA3AF] mt-0.5">{log.user} • Modul {log.module} ({log.target})</div>
                      </div>
                    </div>
                    <span className="text-[11px] text-[#9CA3AF] shrink-0">{log.timestamp}</span>
                  </div>
                ))}
              </div>
            </div>
            <div className="bg-[#1B202B] border border-[#262D3D] rounded-2xl p-5">
              <div className="flex items-center justify-between mb-4">
                <h4 className="text-sm font-bold text-white">Jadwal Booking & Tugas Prioritas</h4>
                <button onClick={() => setActivePage("bookings")} className="text-xs text-[#60A5FA] hover:underline">Kelola Jadwal</button>
              </div>
              <div className="space-y-3">
                {(dbState.bookings || []).slice(0, 3).map(b => (
                  <div key={b.id} className="p-3 rounded-xl bg-[#151922] border border-[#262D3D] flex items-center justify-between gap-3">
                    <div>
                      <div className="text-xs font-bold text-white">{b.purpose} — {b.carName}</div>
                      <div className="text-[11px] text-[#9CA3AF] mt-0.5">Klien: {b.customerName} • {formatDateID(b.date)} ({b.time} WIB)</div>
                    </div>
                    <StatusBadge status={b.status} />
                  </div>
                ))}
                {(dbState.tasks || []).slice(0, 2).map(t => (
                  <div key={t.id} className="p-3 rounded-xl bg-[#151922] border border-[#262D3D] flex items-center justify-between gap-3">
                    <div>
                      <div className="text-xs font-bold text-white">{t.title}</div>
                      <div className="text-[11px] text-[#9CA3AF] mt-0.5">PIC: {t.assignee} • Tenggat: {formatDateID(t.dueDate)}</div>
                    </div>
                    <StatusBadge status={t.status} />
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    function InventoryModule({ dbState, setDbState, initialOpenAdd, initialTab, currentUser, userRoleSpec, configObj, appendAuditLog, pushNotification, globalSearch }) {
      const [tab, setTab] = useState(initialTab || "list");
      const [search, setSearch] = useState(globalSearch || "");
      const [brandFilter, setBrandFilter] = useState("Semua");
      const [statusFilter, setStatusFilter] = useState("Semua");
      const [yearFilter, setYearFilter] = useState("Semua");
      const [locationFilter, setLocationFilter] = useState("Semua");
      const [sortBy, setSortBy] = useState("newest");
      const [page, setPage] = useState(1);
      const pageSize = 8;

      const [formOpen, setFormOpen] = useState(Boolean(initialOpenAdd));
      const [detailCar, setDetailCar] = useState(null);
      const [editingCarId, setEditingCarId] = useState(null);

      const emptyCarForm = {
        brand: "Toyota", model: "", variant: "", year: 2023, color: "",
        plateNumber: "", chassisNumber: "", engineNumber: "", mileage: 0,
        transmission: "Automatic", fuel: "Bensin", engineCC: "1998 cc", seats: 5,
        entryDate: todayISO(), source: "Supplier Rekanan",
        supplier: dbState.suppliers?.[0]?.name || "",
        location: "Showroom Utama Lt. 1", buyPrice: 0, extraCost: 0, sellPrice: 0,
        status: "Baru Masuk", notes: "", photos: []
      };

      const [carForm, setCarForm] = useState(emptyCarForm);
      const [newPhotoUrl, setNewPhotoUrl] = useState("");
      const [uploadingPhoto, setUploadingPhoto] = useState(false);

      useEffect(() => { if (globalSearch !== undefined) setSearch(globalSearch); }, [globalSearch]);

      const carStatuses = ["Baru Masuk", "Menunggu Inspeksi", "Dalam Inspeksi", "Menunggu Perbaikan", "Dalam Perbaikan", "Siap Dijual", "Dibooking", "Terjual", "Tidak Aktif"];

      const filteredCars = useMemo(() => {
        return (dbState.cars || [])
          .filter(c => {
            const q = search.toLowerCase();
            const matchQ = !q || [c.id, c.brand, c.model, c.variant, c.plateNumber, c.color, c.supplier].some(f => String(f || "").toLowerCase().includes(q));
            const matchBrand = brandFilter === "Semua" || c.brand === brandFilter;
            const matchStatus = statusFilter === "Semua" || c.status === statusFilter;
            const matchYear = yearFilter === "Semua" || String(c.year) === yearFilter;
            const matchLoc = locationFilter === "Semua" || c.location === locationFilter;
            return matchQ && matchBrand && matchStatus && matchYear && matchLoc;
          })
          .sort((a, b) => {
            if (sortBy === "price-asc") return (a.sellPrice || 0) - (b.sellPrice || 0);
            if (sortBy === "price-desc") return (b.sellPrice || 0) - (a.sellPrice || 0);
            if (sortBy === "year-desc") return (b.year || 0) - (a.year || 0);
            return String(b.entryDate).localeCompare(String(a.entryDate));
          });
      }, [dbState.cars, search, brandFilter, statusFilter, yearFilter, locationFilter, sortBy]);

      const totalPages = Math.max(1, Math.ceil(filteredCars.length / pageSize));
      const paginatedCars = filteredCars.slice((page - 1) * pageSize, page * pageSize);

      const openCreateModal = () => { setEditingCarId(null); setCarForm(emptyCarForm); setFormOpen(true); };
      const openEditModal = (car) => { setEditingCarId(car.id); setCarForm({ ...car, photos: car.photos || [] }); setFormOpen(true); };

      const handlePhotoFileUpload = async (e) => {
        const files = Array.from(e.target.files || []);
        if (!files.length) return;
        if ((carForm.photos?.length || 0) + files.length > 10) { Swal.fire("Batas Maksimal", "Maksimal 10 foto dokumentasi per kendaraan.", "warning"); return; }
        setUploadingPhoto(true);
        try {
          const uploadedUrls = [];
          for (const file of files) {
            const ext = file.name.split(".").pop().toLowerCase();
            if (!["jpg", "jpeg", "png", "webp"].includes(ext)) throw new Error(`Format ${ext} tidak didukung. Gunakan JPG, JPEG, PNG, atau WEBP.`);
            if (file.size > 4 * 1024 * 1024) throw new Error(`Ukuran ${file.name} melebihi batas 4 MB.`);
            const cloudName = window.CLOUDINARY_CONFIG?.cloudName || configObj?.cloudinary?.cloudName;
            const preset = window.CLOUDINARY_CONFIG?.uploadPreset || configObj?.cloudinary?.uploadPreset;
            if (!cloudName || !preset) throw new Error("Konfigurasi Cloudinary (cloudName / uploadPreset) belum ditemukan di config.js.");
            const fd = new FormData();
            fd.append("file", file);
            fd.append("upload_preset", preset);
            fd.append("folder", "autovia/cars");
            const res = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/image/upload`, { method: "POST", body: fd });
            const data = await res.json();
            if (data.secure_url) uploadedUrls.push(data.secure_url);
            else throw new Error(data.error?.message || "Gagal mengunggah foto ke Cloudinary.");
          }
          setCarForm(prev => ({ ...prev, photos: [...(prev.photos || []), ...uploadedUrls] }));
          Swal.fire({ icon: "success", title: "Foto Terunggah ke Cloudinary", timer: 1400, showConfirmButton: false });
        } catch (err) {
          Swal.fire("Upload Foto Gagal", err.message, "error");
        } finally {
          setUploadingPhoto(false);
          e.target.value = "";
        }
      };

      const handleSaveCar = (e) => {
        e.preventDefault();
        if (!carForm.model || !carForm.plateNumber) { Swal.fire("Validasi", "Model kendaraan dan Nomor Polisi wajib diisi.", "warning"); return; }
        const totalModal = (Number(carForm.buyPrice) || 0) + (Number(carForm.extraCost) || 0);
        if (editingCarId) {
          setDbState(prev => ({
            ...prev,
            cars: prev.cars.map(c => {
              if (c.id !== editingCarId) return c;
              const statusChanged = c.status !== carForm.status;
              const priceChanged = Number(c.sellPrice) !== Number(carForm.sellPrice);
              const newHist = [...(c.history || [])];
              if (statusChanged) newHist.unshift({ date: todayISO(), action: `Status diubah: ${c.status} -> ${carForm.status}`, user: currentUser.name });
              if (priceChanged) newHist.unshift({ date: todayISO(), action: `Harga jual diubah menjadi ${formatIDR(carForm.sellPrice)}`, user: currentUser.name });
              return { ...carForm, id: editingCarId, totalCapital: totalModal, history: newHist };
            })
          }));
          appendAuditLog("Inventaris", `Memperbarui unit ${carForm.brand} ${carForm.model}`, editingCarId);
          Swal.fire({ icon: "success", title: "Data Kendaraan Diperbarui", timer: 1500, showConfirmButton: false });
        } else {
          const newId = `CAR-2026-${String((dbState.cars?.length || 0) + 1).padStart(3, "0")}`;
          const newCar = {
            ...carForm, id: newId,
            buyPrice: Number(carForm.buyPrice) || 0,
            extraCost: Number(carForm.extraCost) || 0,
            totalCapital: totalModal,
            sellPrice: Number(carForm.sellPrice) || 0,
            photos: carForm.photos?.length ? carForm.photos : [`https://placehold.co/800x500/151922/60A5FA?text=${encodeURIComponent(carForm.brand + "+" + carForm.model)}`],
            history: [{ date: todayISO(), action: "Unit baru ditambahkan ke inventaris", user: currentUser.name }]
          };
          setDbState(prev => ({ ...prev, cars: [newCar, ...prev.cars] }));
          appendAuditLog("Inventaris", `Menambahkan unit baru ${newCar.brand} ${newCar.model}`, newId);
          pushNotification("Kendaraan Baru Masuk", `${newCar.brand} ${newCar.model} (${newCar.plateNumber}) ditambahkan ke inventaris.`, "cars");
          Swal.fire({ icon: "success", title: "Kendaraan Berhasil Ditambahkan", timer: 1500, showConfirmButton: false });
        }
        setFormOpen(false);
      };

      const handleDeleteCar = (car) => {
        if (!userRoleSpec.canDelete) { Swal.fire("Akses Ditolak", "Role Anda tidak memiliki izin menghapus unit kendaraan.", "error"); return; }
        Swal.fire({ title: "Hapus Kendaraan?", text: `Unit ${car.brand} ${car.model} (${car.plateNumber}) akan dihapus permanen.`, icon: "warning", showCancelButton: true, confirmButtonText: "Ya, Hapus", cancelButtonText: "Batal" })
          .then(res => {
            if (res.isConfirmed) {
              setDbState(prev => ({ ...prev, cars: prev.cars.filter(c => c.id !== car.id) }));
              appendAuditLog("Inventaris", `Menghapus unit ${car.brand} ${car.model}`, car.id);
            }
          });
      };

      const uniqueYears = [...new Set((dbState.cars || []).map(c => String(c.year)))].sort((a, b) => b - a);

      return (
        <div className="space-y-6">
          <div className="flex flex-wrap items-center justify-between gap-4 bg-[#151922] border border-[#262D3D] p-4 rounded-2xl">
            <div className="flex items-center gap-2">
              <button onClick={() => setTab("list")} className={`px-4 py-2 rounded-xl text-xs font-semibold transition ${tab === "list" ? "bg-[#2563EB] text-white" : "bg-[#1B202B] text-[#9CA3AF]"}`}>Daftar Inventaris ({filteredCars.length})</button>
              <button onClick={() => setTab("history")} className={`px-4 py-2 rounded-xl text-xs font-semibold transition ${tab === "history" ? "bg-[#2563EB] text-white" : "bg-[#1B202B] text-[#9CA3AF]"}`}>Riwayat Perubahan & Status</button>
            </div>
            <div className="flex flex-wrap items-center gap-2">
              <button onClick={() => exportToExcel(filteredCars.map(c => ({ ID: c.id, Merek: c.brand, Model: c.model, Varian: c.variant, Tahun: c.year, NoPolisi: c.plateNumber, Kilometer: c.mileage, HargaBeli: c.buyPrice, BiayaTambahan: c.extraCost, TotalModal: (Number(c.buyPrice) + Number(c.extraCost)), HargaJual: c.sellPrice, EstimasiProfit: Number(c.sellPrice) - (Number(c.buyPrice) + Number(c.extraCost)), Status: c.status, Lokasi: c.location })), "AUTOVIA_Inventaris_Kendaraan")} className="px-3.5 py-2 rounded-xl bg-[#1B202B] hover:bg-[#262D3D] border border-[#262D3D] text-xs font-semibold text-white flex items-center gap-2">
                <Icon name="file-spreadsheet" className="w-4 h-4 text-[#22C55E]" /> Export Excel
              </button>
              <button onClick={() => exportToPDF("Laporan Inventaris Kendaraan", `Total ${filteredCars.length} Unit`, ["ID", "Kendaraan", "Tahun", "No. Polisi", "Total Modal", "Harga Jual", "Status"], filteredCars.map(c => [c.id, `${c.brand} ${c.model}`, c.year, c.plateNumber, formatIDR(Number(c.buyPrice) + Number(c.extraCost)), formatIDR(c.sellPrice), c.status]), "AUTOVIA_Inventaris_PDF")} className="px-3.5 py-2 rounded-xl bg-[#1B202B] hover:bg-[#262D3D] border border-[#262D3D] text-xs font-semibold text-white flex items-center gap-2">
                <Icon name="printer" className="w-4 h-4 text-[#60A5FA]" /> Cetak PDF
              </button>
              <button onClick={openCreateModal} className="px-4 py-2 rounded-xl bg-[#2563EB] hover:bg-blue-600 text-xs font-semibold text-white flex items-center gap-2">
                <Icon name="plus" className="w-4 h-4" /> Tambah Kendaraan
              </button>
            </div>
          </div>

          {tab === "list" ? (
            <>
              <div className="bg-[#1B202B] border border-[#262D3D] rounded-2xl p-4 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-3">
                <input type="text" value={search} onChange={(e) => { setSearch(e.target.value); setPage(1); }} placeholder="Cari model, plat, rangka..." className="bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-[#2563EB]" />
                <select value={brandFilter} onChange={(e) => { setBrandFilter(e.target.value); setPage(1); }} className="bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2 text-xs text-white">
                  <option value="Semua">Semua Merek</option>
                  {(dbState.settings?.brands || []).map(b => <option key={b} value={b}>{b}</option>)}
                </select>
                <select value={statusFilter} onChange={(e) => { setStatusFilter(e.target.value); setPage(1); }} className="bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2 text-xs text-white">
                  <option value="Semua">Semua Status</option>
                  {carStatuses.map(s => <option key={s} value={s}>{s}</option>)}
                </select>
                <select value={yearFilter} onChange={(e) => { setYearFilter(e.target.value); setPage(1); }} className="bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2 text-xs text-white">
                  <option value="Semua">Semua Tahun</option>
                  {uniqueYears.map(y => <option key={y} value={y}>{y}</option>)}
                </select>
                <select value={locationFilter} onChange={(e) => { setLocationFilter(e.target.value); setPage(1); }} className="bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2 text-xs text-white">
                  <option value="Semua">Semua Lokasi</option>
                  {(dbState.settings?.locations || []).map(l => <option key={l} value={l}>{l}</option>)}
                </select>
                <select value={sortBy} onChange={(e) => setSortBy(e.target.value)} className="bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2 text-xs text-white">
                  <option value="newest">Urutkan: Terbaru Masuk</option>
                  <option value="price-desc">Harga Jual: Tertinggi</option>
                  <option value="price-asc">Harga Jual: Terendah</option>
                  <option value="year-desc">Tahun: Terbaru</option>
                </select>
              </div>

              <div className="bg-[#1B202B] border border-[#262D3D] rounded-2xl overflow-hidden">
                <div className="overflow-x-auto">
                  <table className="w-full text-left border-collapse">
                    <thead>
                      <tr className="bg-[#151922] border-b border-[#262D3D] text-[11px] font-bold uppercase tracking-wider text-[#9CA3AF]">
                        <th className="py-3.5 px-4">Unit & ID</th>
                        <th className="py-3.5 px-4">No. Polisi & Spek</th>
                        <th className="py-3.5 px-4">Lokasi & Tgl Masuk</th>
                        <th className="py-3.5 px-4 text-right">Total Modal</th>
                        <th className="py-3.5 px-4 text-right">Harga Jual</th>
                        <th className="py-3.5 px-4 text-right">Est. Profit</th>
                        <th className="py-3.5 px-4">Status</th>
                        <th className="py-3.5 px-4 text-right">Aksi</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-[#262D3D] text-xs">
                      {paginatedCars.map(car => {
                        const modal = (Number(car.buyPrice) || 0) + (Number(car.extraCost) || 0);
                        const estProfit = (Number(car.sellPrice) || 0) - modal;
                        return (
                          <tr key={car.id} className="hover:bg-[#151922]/70 transition">
                            <td className="py-3.5 px-4">
                              <div className="flex items-center gap-3">
                                <img src={car.photos?.[0] || "https://placehold.co/120x80/151922/60A5FA?text=Unit"} alt={car.model} className="w-14 h-10 rounded-lg object-cover border border-[#262D3D] shrink-0" />
                                <div>
                                  <div className="font-bold text-white">{car.brand} {car.model}</div>
                                  <div className="text-[11px] text-[#9CA3AF]">{car.variant} • {car.year} ({car.id})</div>
                                </div>
                              </div>
                            </td>
                            <td className="py-3.5 px-4">
                              <div className="font-semibold text-white">{car.plateNumber}</div>
                              <div className="text-[11px] text-[#9CA3AF]">{Number(car.mileage).toLocaleString("id-ID")} km • {car.transmission}</div>
