                            </td>
                            <td className="py-3.5 px-4">
                              <div className="text-white">{car.location}</div>
                              <div className="text-[11px] text-[#9CA3AF]">Masuk: {formatDateID(car.entryDate)}</div>
                            </td>
                            <td className="py-3.5 px-4 text-right font-medium text-[#9CA3AF]">{formatIDR(modal)}</td>
                            <td className="py-3.5 px-4 text-right font-bold text-white">{formatIDR(car.sellPrice)}</td>
                            <td className={`py-3.5 px-4 text-right font-bold ${estProfit >= 0 ? "text-[#22C55E]" : "text-[#EF4444]"}`}>{formatIDR(estProfit)}</td>
                            <td className="py-3.5 px-4"><StatusBadge status={car.status} /></td>
                            <td className="py-3.5 px-4 text-right">
                              <div className="inline-flex items-center gap-1.5">
                                <button onClick={() => setDetailCar(car)} title="Detail Lengkap" className="p-2 rounded-lg bg-[#151922] hover:bg-[#2563EB]/20 text-[#60A5FA] border border-[#262D3D]"><Icon name="eye" className="w-3.5 h-3.5" /></button>
                                <button onClick={() => openEditModal(car)} title="Edit Kendaraan" className="p-2 rounded-lg bg-[#151922] hover:bg-amber-500/20 text-amber-400 border border-[#262D3D]"><Icon name="pencil" className="w-3.5 h-3.5" /></button>
                                <button onClick={() => handleDeleteCar(car)} title="Hapus Kendaraan" className="p-2 rounded-lg bg-[#151922] hover:bg-rose-500/20 text-rose-400 border border-[#262D3D]"><Icon name="trash-2" className="w-3.5 h-3.5" /></button>
                              </div>
                            </td>
                          </tr>
                        );
                      })}
                      {!paginatedCars.length && (<tr><td colSpan="8" className="py-10 text-center text-[#9CA3AF]">Tidak ditemukan unit kendaraan sesuai kriteria filter.</td></tr>)}
                    </tbody>
                  </table>
                </div>
                <div className="px-4 py-3 bg-[#151922] border-t border-[#262D3D] flex items-center justify-between text-xs text-[#9CA3AF]">
                  <span>Menampilkan {paginatedCars.length} dari {filteredCars.length} unit</span>
                  <div className="flex items-center gap-1.5">
                    <button disabled={page <= 1} onClick={() => setPage(p => Math.max(1, p - 1))} className="px-3 py-1.5 rounded-lg bg-[#1B202B] border border-[#262D3D] disabled:opacity-40">Sebelumnya</button>
                    <span className="px-2 text-white font-semibold">Hal {page} / {totalPages}</span>
                    <button disabled={page >= totalPages} onClick={() => setPage(p => Math.min(totalPages, p + 1))} className="px-3 py-1.5 rounded-lg bg-[#1B202B] border border-[#262D3D] disabled:opacity-40">Berikutnya</button>
                  </div>
                </div>
              </div>
            </>
          ) : (
            <div className="bg-[#1B202B] border border-[#262D3D] rounded-2xl p-5 space-y-4">
              <h4 className="text-sm font-bold text-white">Riwayat Perubahan Status, Harga & Biaya Kendaraan</h4>
              <div className="space-y-3">
                {(dbState.cars || []).flatMap(c => (c.history || []).map((h, i) => ({ ...h, carName: `${c.brand} ${c.model} (${c.plateNumber})`, key: `${c.id}-${i}` })))
                  .map(item => (
                    <div key={item.key} className="p-3.5 rounded-xl bg-[#151922] border border-[#262D3D] flex items-center justify-between">
                      <div>
                        <div className="text-xs font-bold text-white">{item.carName}</div>
                        <div className="text-xs text-[#60A5FA] mt-0.5">{item.action}</div>
                      </div>
                      <div className="text-right text-[11px] text-[#9CA3AF]">
                        <div>{formatDateID(item.date)}</div>
                        <div>Oleh: {item.user}</div>
                      </div>
                    </div>
                  ))}
              </div>
            </div>
          )}

          <Modal open={formOpen} onClose={() => setFormOpen(false)} title={editingCarId ? `Edit Kendaraan (${editingCarId})` : "Tambah Kendaraan Baru"} subtitle="Lengkapi spesifikasi teknis, harga modal, dan dokumentasi foto Cloudinary" maxWidth="max-w-4xl">
            <form onSubmit={handleSaveCar} className="space-y-5 text-xs">
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div><label className="block text-[#9CA3AF] font-semibold mb-1">Merek *</label><select value={carForm.brand} onChange={(e) => setCarForm({ ...carForm, brand: e.target.value })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white">{(dbState.settings?.brands || []).map(b => <option key={b} value={b}>{b}</option>)}</select></div>
                <div><label className="block text-[#9CA3AF] font-semibold mb-1">Model *</label><input required type="text" value={carForm.model} onChange={(e) => setCarForm({ ...carForm, model: e.target.value })} placeholder="Contoh: 320i M Sport / Fortuner" className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white" /></div>
                <div><label className="block text-[#9CA3AF] font-semibold mb-1">Varian / Tipe</label><input type="text" value={carForm.variant} onChange={(e) => setCarForm({ ...carForm, variant: e.target.value })} placeholder="Contoh: G20 LCI / VRZ 4x2" className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white" /></div>
                <div><label className="block text-[#9CA3AF] font-semibold mb-1">Tahun Pembuatan *</label><input type="number" value={carForm.year} onChange={(e) => setCarForm({ ...carForm, year: Number(e.target.value) })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white" /></div>
                <div><label className="block text-[#9CA3AF] font-semibold mb-1">Warna</label><input type="text" value={carForm.color} onChange={(e) => setCarForm({ ...carForm, color: e.target.value })} placeholder="Mineral White" className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white" /></div>
                <div><label className="block text-[#9CA3AF] font-semibold mb-1">Nomor Polisi *</label><input required type="text" value={carForm.plateNumber} onChange={(e) => setCarForm({ ...carForm, plateNumber: e.target.value.toUpperCase() })} placeholder="B 1234 XYZ" className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white" /></div>
                <div><label className="block text-[#9CA3AF] font-semibold mb-1">Nomor Rangka (VIN)</label><input type="text" value={carForm.chassisNumber} onChange={(e) => setCarForm({ ...carForm, chassisNumber: e.target.value.toUpperCase() })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white" /></div>
                <div><label className="block text-[#9CA3AF] font-semibold mb-1">Nomor Mesin</label><input type="text" value={carForm.engineNumber} onChange={(e) => setCarForm({ ...carForm, engineNumber: e.target.value.toUpperCase() })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white" /></div>
                <div><label className="block text-[#9CA3AF] font-semibold mb-1">Kilometer (Odometer)</label><input type="number" value={carForm.mileage} onChange={(e) => setCarForm({ ...carForm, mileage: Number(e.target.value) })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white" /></div>
                <div><label className="block text-[#9CA3AF] font-semibold mb-1">Transmisi</label><select value={carForm.transmission} onChange={(e) => setCarForm({ ...carForm, transmission: e.target.value })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white"><option value="Automatic">Automatic</option><option value="Manual">Manual</option><option value="CVT">CVT</option><option value="Dual Clutch (DCT)">Dual Clutch (DCT)</option><option value="Single Speed EV">Single Speed EV</option></select></div>
                <div><label className="block text-[#9CA3AF] font-semibold mb-1">Bahan Bakar</label><select value={carForm.fuel} onChange={(e) => setCarForm({ ...carForm, fuel: e.target.value })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white"><option value="Bensin">Bensin</option><option value="Diesel">Diesel</option><option value="Hybrid">Hybrid</option><option value="Listrik (EV)">Listrik (EV)</option></select></div>
                <div><label className="block text-[#9CA3AF] font-semibold mb-1">Kapasitas Mesin & Penumpang</label><div className="grid grid-cols-2 gap-2"><input type="text" value={carForm.engineCC} onChange={(e) => setCarForm({ ...carForm, engineCC: e.target.value })} placeholder="1998 cc" className="bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white" /><input type="number" value={carForm.seats} onChange={(e) => setCarForm({ ...carForm, seats: Number(e.target.value) })} placeholder="5" className="bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white" /></div></div>
                <div><label className="block text-[#9CA3AF] font-semibold mb-1">Tanggal Masuk</label><input type="date" value={carForm.entryDate} onChange={(e) => setCarForm({ ...carForm, entryDate: e.target.value })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white" /></div>
                <div><label className="block text-[#9CA3AF] font-semibold mb-1">Supplier / Sumber Unit</label><input type="text" value={carForm.supplier} onChange={(e) => setCarForm({ ...carForm, supplier: e.target.value })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white" /></div>
                <div><label className="block text-[#9CA3AF] font-semibold mb-1">Lokasi Penyimpanan</label><select value={carForm.location} onChange={(e) => setCarForm({ ...carForm, location: e.target.value })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white">{(dbState.settings?.locations || []).map(l => <option key={l} value={l}>{l}</option>)}</select></div>
              </div>

              <div className="p-4 rounded-2xl bg-[#151922] border border-[#262D3D] grid grid-cols-1 sm:grid-cols-4 gap-4">
                <div><label className="block text-[#9CA3AF] font-semibold mb-1">Harga Beli (Rp)</label><input type="number" value={carForm.buyPrice} onChange={(e) => setCarForm({ ...carForm, buyPrice: Number(e.target.value) })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white font-semibold" /></div>
                <div><label className="block text-[#9CA3AF] font-semibold mb-1">Biaya Tambahan / Rekondisi</label><input type="number" value={carForm.extraCost} onChange={(e) => setCarForm({ ...carForm, extraCost: Number(e.target.value) })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white font-semibold" /></div>
                <div><label className="block text-[#9CA3AF] font-semibold mb-1">Harga Jual Target (Rp)</label><input type="number" value={carForm.sellPrice} onChange={(e) => setCarForm({ ...carForm, sellPrice: Number(e.target.value) })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white font-semibold" /></div>
                <div><label className="block text-[#9CA3AF] font-semibold mb-1">Status Operasional</label><select value={carForm.status} onChange={(e) => setCarForm({ ...carForm, status: e.target.value })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white font-semibold">{carStatuses.map(s => <option key={s} value={s}>{s}</option>)}</select></div>
                <div className="sm:col-span-4 flex flex-wrap items-center justify-between pt-2 border-t border-[#262D3D] text-xs">
                  <span>Total Modal: <strong className="text-white">{formatIDR((Number(carForm.buyPrice) || 0) + (Number(carForm.extraCost) || 0))}</strong></span>
                  <span>Estimasi Keuntungan: <strong className="text-[#22C55E]">{formatIDR((Number(carForm.sellPrice) || 0) - ((Number(carForm.buyPrice) || 0) + (Number(carForm.extraCost) || 0)))}</strong></span>
                </div>
              </div>

              <div className="p-4 rounded-2xl bg-[#151922] border border-[#262D3D] space-y-3">
                <div className="flex flex-wrap items-center justify-between gap-2">
                  <div>
                    <div className="font-bold text-white">Dokumentasi Foto Kendaraan (Maks. 10 Foto, 4MB/foto)</div>
                    <div className="text-[11px] text-[#9CA3AF]">Format: JPG, JPEG, PNG, WEBP. Foto pertama menjadi tampilan utama.</div>
                  </div>
                  <label className="px-3.5 py-2 rounded-xl bg-[#2563EB] hover:bg-blue-600 text-white font-semibold cursor-pointer inline-flex items-center gap-2">
                    <Icon name="upload" className="w-3.5 h-3.5" /><span>{uploadingPhoto ? "Mengunggah..." : "Upload File Foto"}</span>
                    <input type="file" multiple accept=".jpg,.jpeg,.png,.webp" onChange={handlePhotoFileUpload} className="hidden" />
                  </label>
                </div>
                <div className="flex gap-2">
                  <input type="url" value={newPhotoUrl} onChange={(e) => setNewPhotoUrl(e.target.value)} placeholder="Atau tempel URL foto Cloudinary..." className="flex-1 bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2 text-white" />
                  <button type="button" onClick={() => { if (!newPhotoUrl) return; if ((carForm.photos?.length || 0) >= 10) return; setCarForm(prev => ({ ...prev, photos: [...(prev.photos || []), newPhotoUrl] })); setNewPhotoUrl(""); }} className="px-3.5 py-2 rounded-xl bg-[#1B202B] border border-[#262D3D] text-white font-semibold">Tambah URL</button>
                </div>
                {carForm.photos?.length > 0 && (
                  <div className="grid grid-cols-2 sm:grid-cols-5 gap-3 pt-2">
                    {carForm.photos.map((url, idx) => (
                      <div key={idx} className="relative group rounded-xl overflow-hidden border border-[#262D3D] bg-[#0B0D12]">
                        <img src={url} alt="Preview" className="w-full h-24 object-cover" />
                        {idx === 0 && (<span className="absolute top-1.5 left-1.5 px-2 py-0.5 rounded bg-[#2563EB] text-[10px] font-bold text-white">Utama</span>)}
                        <div className="p-1.5 flex items-center justify-between bg-[#151922]">
                          {idx > 0 ? (
                            <button type="button" onClick={() => { const arr = [...carForm.photos]; const [picked] = arr.splice(idx, 1); arr.unshift(picked); setCarForm({ ...carForm, photos: arr }); }} className="text-[10px] text-[#60A5FA] hover:underline">Set Utama</button>
                          ) : <span className="text-[10px] text-[#9CA3AF]">Cover</span>}
                          <button type="button" onClick={() => setCarForm({ ...carForm, photos: carForm.photos.filter((_, i) => i !== idx) })} className="text-rose-400 hover:text-rose-300"><Icon name="trash-2" className="w-3.5 h-3.5" /></button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              <div><label className="block text-[#9CA3AF] font-semibold mb-1">Catatan Internal Kendaraan</label><textarea rows="2" value={carForm.notes} onChange={(e) => setCarForm({ ...carForm, notes: e.target.value })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2 text-white" /></div>

              <div className="flex justify-end gap-3 pt-2">
                <button type="button" onClick={() => setFormOpen(false)} className="px-4 py-2.5 rounded-xl bg-[#151922] border border-[#262D3D] text-[#9CA3AF]">Batal</button>
                <button type="submit" className="px-5 py-2.5 rounded-xl bg-[#2563EB] hover:bg-blue-600 text-white font-semibold">Simpan Data Kendaraan</button>
              </div>
            </form>
          </Modal>

          <Modal open={Boolean(detailCar)} onClose={() => setDetailCar(null)} title={detailCar ? `${detailCar.brand} ${detailCar.model} (${detailCar.year})` : ""} subtitle={detailCar ? `ID: ${detailCar.id} • No. Polisi: ${detailCar.plateNumber}` : ""} maxWidth="max-w-3xl">
            {detailCar && (
              <div className="space-y-5 text-xs">
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  {(detailCar.photos || []).map((p, i) => (<img key={i} src={p} alt="Unit" className="w-full h-44 object-cover rounded-xl border border-[#262D3D]" />))}
                </div>
                <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 bg-[#151922] p-4 rounded-xl border border-[#262D3D]">
                  <div><span className="text-[#9CA3AF] block">Varian</span><strong className="text-white">{detailCar.variant || "-"}</strong></div>
                  <div><span className="text-[#9CA3AF] block">Warna</span><strong className="text-white">{detailCar.color || "-"}</strong></div>
                  <div><span className="text-[#9CA3AF] block">Kilometer</span><strong className="text-white">{Number(detailCar.mileage).toLocaleString("id-ID")} km</strong></div>
                  <div><span className="text-[#9CA3AF] block">Transmisi / BBM</span><strong className="text-white">{detailCar.transmission} / {detailCar.fuel}</strong></div>
                  <div><span className="text-[#9CA3AF] block">No. Rangka</span><strong className="text-white">{detailCar.chassisNumber || "-"}</strong></div>
                  <div><span className="text-[#9CA3AF] block">No. Mesin</span><strong className="text-white">{detailCar.engineNumber || "-"}</strong></div>
                  <div><span className="text-[#9CA3AF] block">Harga Beli</span><strong className="text-white">{formatIDR(detailCar.buyPrice)}</strong></div>
                  <div><span className="text-[#9CA3AF] block">Biaya Tambahan</span><strong className="text-white">{formatIDR(detailCar.extraCost)}</strong></div>
                  <div><span className="text-[#9CA3AF] block">Harga Jual</span><strong className="text-[#22C55E]">{formatIDR(detailCar.sellPrice)}</strong></div>
                </div>
                <div className="p-3.5 rounded-xl bg-[#151922] border border-[#262D3D]">
                  <div className="text-[#9CA3AF] font-semibold mb-1">Catatan Internal:</div>
                  <div className="text-white">{detailCar.notes || "Tidak ada catatan."}</div>
                </div>
              </div>
            )}
          </Modal>
        </div>
      );
    }

    function PurchasesModule({ dbState, setDbState, currentUser, appendAuditLog, pushNotification }) {
      const [modalOpen, setModalOpen] = useState(false);
      const [form, setForm] = useState({
        date: todayISO(), supplierId: dbState.suppliers?.[0]?.id || "",
        sellerName: dbState.suppliers?.[0]?.name || "", phone: dbState.suppliers?.[0]?.phone || "",
        linkMode: "new", existingCarId: "", brand: "Toyota", model: "", variant: "",
        year: 2023, plateNumber: "", buyPrice: 0, adminFee: 0, shippingFee: 0, extraFee: 0,
        paymentMethod: "Transfer Bank BCA", paidAmount: 0, dueDate: todayISO(), notes: ""
      });

      const handleSupplierSelect = (supId) => {
        const sup = (dbState.suppliers || []).find(s => s.id === supId);
        setForm(prev => ({ ...prev, supplierId: supId, sellerName: sup ? sup.name : prev.sellerName, phone: sup ? sup.phone : prev.phone }));
      };

      const handleCreatePurchase = (e) => {
        e.preventDefault();
        const totalPurchase = (Number(form.buyPrice) || 0) + (Number(form.adminFee) || 0) + (Number(form.shippingFee) || 0) + (Number(form.extraFee) || 0);
        const paid = Number(form.paidAmount) || 0;
        const remaining = Math.max(0, totalPurchase - paid);
        const status = remaining === 0 ? "Lunas" : paid > 0 ? "Belum Lunas" : "Belum Dibayar";

        let targetCarId = form.existingCarId;
        let carTitle = "";
        let updatedCars = [...(dbState.cars || [])];

        if (form.linkMode === "new") {
          targetCarId = `CAR-2026-${String(updatedCars.length + 1).padStart(3, "0")}`;
          carTitle = `${form.brand} ${form.model} ${form.year}`;
          updatedCars.unshift({
            id: targetCarId, brand: form.brand, model: form.model, variant: form.variant,
            year: Number(form.year), color: "-", plateNumber: form.plateNumber.toUpperCase() || "PROSES STNK",
            chassisNumber: "-", engineNumber: "-", mileage: 0, transmission: "Automatic",
            fuel: "Bensin", engineCC: "-", seats: 5, entryDate: form.date,
            source: "Pembelian Supplier", supplier: form.sellerName,
            location: "Bay Inspeksi & Detailing",
            buyPrice: Number(form.buyPrice) || 0,
            extraCost: (Number(form.adminFee) || 0) + (Number(form.shippingFee) || 0) + (Number(form.extraFee) || 0),
            sellPrice: Math.round(totalPurchase * 1.1), status: "Menunggu Inspeksi",
            notes: `Masuk otomatis dari pembelian ${form.sellerName}`,
            photos: [`https://placehold.co/800x500/151922/60A5FA?text=${encodeURIComponent(form.brand + "+" + form.model)}`],
            history: [{ date: form.date, action: "Masuk otomatis melalui modul Pembelian", user: currentUser.name }]
          });
        } else {
          const existing = updatedCars.find(c => c.id === form.existingCarId);
          carTitle = existing ? `${existing.brand} ${existing.model} ${existing.year}` : form.existingCarId;
        }

        const poId = `PO-2026-${String((dbState.purchases?.length || 0) + 1).padStart(3, "0")}`;
        const newPO = {
          id: poId, date: form.date, sellerName: form.sellerName, supplierId: form.supplierId,
          phone: form.phone, carId: targetCarId, carName: carTitle,
          buyPrice: Number(form.buyPrice) || 0, adminFee: Number(form.adminFee) || 0,
          shippingFee: Number(form.shippingFee) || 0, extraFee: Number(form.extraFee) || 0,
          totalPurchase, paymentMethod: form.paymentMethod, paidAmount: paid,
          remainingAmount: remaining, dueDate: form.dueDate, adminName: currentUser.name,
          status, notes: form.notes
        };

        const updatedCash = [...(dbState.cashTransactions || [])];
        if (paid > 0) {
          updatedCash.unshift({
            id: `CSH-${Date.now().toString().slice(-4)}`, date: form.date, type: "Kas Keluar",
            category: "Pembelian Kendaraan", description: `Pembayaran ${poId} (${carTitle})`,
            method: form.paymentMethod, amount: paid
          });
        }

        setDbState(prev => ({ ...prev, cars: updatedCars, purchases: [newPO, ...prev.purchases], cashTransactions: updatedCash }));
        appendAuditLog("Pembelian", `Mencatat pembelian ${poId} (${carTitle})`, poId);
        pushNotification("Pembelian Kendaraan Baru", `${poId} untuk ${carTitle} telah dicatat dan terhubung ke inventaris.`, "purchases");
        setModalOpen(false);
        Swal.fire({ icon: "success", title: "Pembelian Tercatat", text: `${poId} berhasil disimpan dan disinkronkan ke inventaris.`, timer: 1800, showConfirmButton: false });
      };

      const handleCancelPO = (po) => {
        Swal.fire({ title: "Batalkan Pembelian?", text: `Transaksi ${po.id} akan ditandai Dibatalkan tanpa menghapus riwayat audit.`, icon: "warning", showCancelButton: true, confirmButtonText: "Ya, Batalkan" })
          .then(res => {
            if (res.isConfirmed) {
              setDbState(prev => ({ ...prev, purchases: prev.purchases.map(p => p.id === po.id ? { ...p, status: "Dibatalkan" } : p) }));
              appendAuditLog("Pembelian", `Membatalkan transaksi ${po.id}`, po.id);
            }
          });
      };

      return (
        <div className="space-y-6">
          <div className="flex flex-wrap items-center justify-between gap-4 bg-[#151922] border border-[#262D3D] p-4 rounded-2xl">
            <div>
              <h3 className="text-sm font-bold text-white">Manajemen Pembelian Kendaraan</h3>
              <p className="text-xs text-[#9CA3AF]">Terintegrasi langsung dengan inventaris kendaraan & arus kas keluar.</p>
            </div>
            <div className="flex items-center gap-2">
              <button onClick={() => exportToExcel(dbState.purchases, "AUTOVIA_Pembelian_Kendaraan")} className="px-3.5 py-2 rounded-xl bg-[#1B202B] border border-[#262D3D] text-xs font-semibold text-white flex items-center gap-2"><Icon name="file-spreadsheet" className="w-4 h-4 text-[#22C55E]" /> Export Excel</button>
              <button onClick={() => setModalOpen(true)} className="px-4 py-2 rounded-xl bg-[#2563EB] hover:bg-blue-600 text-xs font-semibold text-white flex items-center gap-2"><Icon name="plus" className="w-4 h-4" /> Catat Pembelian Baru</button>
            </div>
          </div>

          <div className="bg-[#1B202B] border border-[#262D3D] rounded-2xl overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-left border-collapse text-xs">
                <thead>
                  <tr className="bg-[#151922] border-b border-[#262D3D] text-[11px] font-bold uppercase text-[#9CA3AF]">
                    <th className="py-3.5 px-4">No. Pembelian</th>
                    <th className="py-3.5 px-4">Supplier / Penjual</th>
                    <th className="py-3.5 px-4">Kendaraan</th>
                    <th className="py-3.5 px-4 text-right">Total Pembelian</th>
                    <th className="py-3.5 px-4 text-right">Terbayar</th>
                    <th className="py-3.5 px-4 text-right">Sisa Utang</th>
                    <th className="py-3.5 px-4">Status</th>
                    <th className="py-3.5 px-4 text-right">Aksi</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-[#262D3D]">
                  {(dbState.purchases || []).map(po => (
                    <tr key={po.id} className="hover:bg-[#151922]/60">
                      <td className="py-3.5 px-4"><div className="font-bold text-white">{po.id}</div><div className="text-[11px] text-[#9CA3AF]">{formatDateID(po.date)}</div></td>
                      <td className="py-3.5 px-4"><div className="font-semibold text-white">{po.sellerName}</div><div className="text-[11px] text-[#9CA3AF]">{po.phone}</div></td>
                      <td className="py-3.5 px-4"><div className="text-white font-medium">{po.carName}</div><div className="text-[11px] text-[#60A5FA]">ID Unit: {po.carId}</div></td>
                      <td className="py-3.5 px-4 text-right font-bold text-white">{formatIDR(po.totalPurchase)}</td>
                      <td className="py-3.5 px-4 text-right text-[#22C55E] font-semibold">{formatIDR(po.paidAmount)}</td>
                      <td className="py-3.5 px-4 text-right text-[#F59E0B] font-semibold">{formatIDR(po.remainingAmount)}</td>
                      <td className="py-3.5 px-4"><StatusBadge status={po.status} /></td>
                      <td className="py-3.5 px-4 text-right">
                        <div className="inline-flex gap-1.5">
                          <button onClick={() => printDocumentReceipt("Bukti Pembelian Kendaraan", po.id, po.date, "Supplier / Penjual", `${po.sellerName} (${po.phone})`, [[po.carName, `Metode: ${po.paymentMethod}`, formatIDR(po.buyPrice)], ["Biaya Admin & Pengiriman", "-", formatIDR((po.adminFee || 0) + (po.shippingFee || 0) + (po.extraFee || 0))]], [["Total Pembelian", formatIDR(po.totalPurchase)], ["Jumlah Dibayar", formatIDR(po.paidAmount)], ["Sisa Pembayaran", formatIDR(po.remainingAmount)]], po.notes)} title="Cetak Bukti Pembelian" className="p-2 rounded-lg bg-[#151922] text-[#60A5FA] border border-[#262D3D]"><Icon name="printer" className="w-3.5 h-3.5" /></button>
                          {po.status !== "Dibatalkan" && (<button onClick={() => handleCancelPO(po)} title="Batalkan Pembelian" className="p-2 rounded-lg bg-[#151922] text-rose-400 border border-[#262D3D]"><Icon name="x-circle" className="w-3.5 h-3.5" /></button>)}
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          <Modal open={modalOpen} onClose={() => setModalOpen(false)} title="Catat Pembelian Kendaraan" subtitle="Otomatis terhubung ke inventaris tanpa duplikasi unit" maxWidth="max-w-3xl">
            <form onSubmit={handleCreatePurchase} className="space-y-4 text-xs">
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div><label className="block text-[#9CA3AF] font-semibold mb-1">Tanggal Pembelian</label><input type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white" /></div>
                <div><label className="block text-[#9CA3AF] font-semibold mb-1">Pilih Supplier</label><select value={form.supplierId} onChange={(e) => handleSupplierSelect(e.target.value)} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white"><option value="">-- Penjual Perorangan / Baru --</option>{(dbState.suppliers || []).map(s => <option key={s.id} value={s.id}>{s.name}</option>)}</select></div>
                <div><label className="block text-[#9CA3AF] font-semibold mb-1">Nama Penjual / Supplier *</label><input required type="text" value={form.sellerName} onChange={(e) => setForm({ ...form, sellerName: e.target.value })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white" /></div>
              </div>

              <div className="p-4 rounded-xl bg-[#151922] border border-[#262D3D] space-y-3">
                <div className="flex items-center gap-4">
                  <label className="flex items-center gap-2 cursor-pointer"><input type="radio" checked={form.linkMode === "new"} onChange={() => setForm({ ...form, linkMode: "new" })} /><span className="font-semibold text-white">Buat Unit Baru di Inventaris</span></label>
                  <label className="flex items-center gap-2 cursor-pointer"><input type="radio" checked={form.linkMode === "existing"} onChange={() => setForm({ ...form, linkMode: "existing" })} /><span className="font-semibold text-white">Hubungkan Unit Inventaris yang Ada</span></label>
                </div>
                {form.linkMode === "new" ? (
                  <div className="grid grid-cols-1 sm:grid-cols-4 gap-3">
                    <div><label className="block text-[#9CA3AF] mb-1">Merek</label><select value={form.brand} onChange={(e) => setForm({ ...form, brand: e.target.value })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2 text-white">{(dbState.settings?.brands || []).map(b => <option key={b} value={b}>{b}</option>)}</select></div>
                    <div><label className="block text-[#9CA3AF] mb-1">Model *</label><input required type="text" value={form.model} onChange={(e) => setForm({ ...form, model: e.target.value })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2 text-white" /></div>
                    <div><label className="block text-[#9CA3AF] mb-1">Tahun</label><input type="number" value={form.year} onChange={(e) => setForm({ ...form, year: Number(e.target.value) })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2 text-white" /></div>
                    <div><label className="block text-[#9CA3AF] mb-1">No. Polisi</label><input type="text" value={form.plateNumber} onChange={(e) => setForm({ ...form, plateNumber: e.target.value })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2 text-white" /></div>
                  </div>
                ) : (
                  <select value={form.existingCarId} onChange={(e) => setForm({ ...form, existingCarId: e.target.value })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white"><option value="">-- Pilih Unit Inventaris --</option>{(dbState.cars || []).map(c => <option key={c.id} value={c.id}>{c.id} — {c.brand} {c.model} ({c.plateNumber})</option>)}</select>
                )}
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-4 gap-3">
                <div><label className="block text-[#9CA3AF] mb-1">Harga Beli (Rp)</label><input type="number" value={form.buyPrice} onChange={(e) => setForm({ ...form, buyPrice: Number(e.target.value) })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2 text-white" /></div>
                <div><label className="block text-[#9CA3AF] mb-1">Biaya Administrasi</label><input type="number" value={form.adminFee} onChange={(e) => setForm({ ...form, adminFee: Number(e.target.value) })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2 text-white" /></div>
                <div><label className="block text-[#9CA3AF] mb-1">Biaya Pengiriman</label><input type="number" value={form.shippingFee} onChange={(e) => setForm({ ...form, shippingFee: Number(e.target.value) })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2 text-white" /></div>
                <div><label className="block text-[#9CA3AF] mb-1">Biaya Tambahan</label><input type="number" value={form.extraFee} onChange={(e) => setForm({ ...form, extraFee: Number(e.target.value) })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2 text-white" /></div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div><label className="block text-[#9CA3AF] mb-1">Metode Pembayaran</label><select value={form.paymentMethod} onChange={(e) => setForm({ ...form, paymentMethod: e.target.value })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white">{(dbState.settings?.paymentMethods || []).map(m => <option key={m} value={m}>{m}</option>)}</select></div>
                <div><label className="block text-[#9CA3AF] mb-1">Jumlah Dibayarkan (Rp)</label><input type="number" value={form.paidAmount} onChange={(e) => setForm({ ...form, paidAmount: Number(e.target.value) })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white" /></div>
                <div><label className="block text-[#9CA3AF] mb-1">Jatuh Tempo (Jika Utang)</label><input type="date" value={form.dueDate} onChange={(e) => setForm({ ...form, dueDate: e.target.value })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white" /></div>
              </div>

              <div className="flex justify-end gap-3 pt-2">
                <button type="button" onClick={() => setModalOpen(false)} className="px-4 py-2 rounded-xl bg-[#151922] border border-[#262D3D] text-[#9CA3AF]">Batal</button>
                <button type="submit" className="px-5 py-2 rounded-xl bg-[#2563EB] text-white font-semibold">Simpan Pembelian</button>
              </div>
            </form>
          </Modal>
        </div>
      );
    }

    function InspectionsModule({ dbState, setDbState, currentUser, appendAuditLog }) {
      const [modalOpen, setModalOpen] = useState(false);
      const [form, setForm] = useState({
        carId: dbState.cars?.[0]?.id || "", date: todayISO(), inspector: currentUser.name,
        engine: "Baik", transmission: "Baik", exterior: "Baik", interior: "Baik",
        suspension: "Baik", tires: "Baik", electrical: "Baik", documents: "Baik",
        recommendation: "", notes: "", updateCarStatus: "Siap Dijual"
      });

      const handleSaveInspection = (e) => {
        e.preventDefault();
        const car = (dbState.cars || []).find(c => c.id === form.carId);
        const insId = `INS-2026-${String((dbState.inspections?.length || 0) + 1).padStart(3, "0")}`;
        const newIns = { ...form, id: insId, carName: car ? `${car.brand} ${car.model} (${car.plateNumber})` : form.carId };
        setDbState(prev => ({
          ...prev,
          inspections: [newIns, ...prev.inspections],
          cars: prev.cars.map(c => c.id === form.carId ? { ...c, status: form.updateCarStatus || c.status, history: [{ date: form.date, action: `Inspeksi selesai (${insId}) -> ${form.updateCarStatus}`, user: currentUser.name }, ...(c.history || [])] } : c)
        }));
        appendAuditLog("Inspeksi", `Menyimpan hasil inspeksi ${insId}`, form.carId);
        setModalOpen(false);
        Swal.fire({ icon: "success", title: "Hasil Inspeksi Tersimpan", timer: 1500, showConfirmButton: false });
      };

      const checkFields = [
        ["engine", "Kondisi Mesin"], ["transmission", "Kondisi Transmisi"], ["exterior", "Kondisi Eksterior"], ["interior", "Kondisi Interior"],
        ["suspension", "Kondisi Kaki-Kaki"], ["tires", "Kondisi Ban"], ["electrical", "Kondisi Kelistrikan"], ["documents", "Kelengkapan Dokumen"]
      ];

      return (
        <div className="space-y-6">
          <div className="flex flex-wrap items-center justify-between gap-4 bg-[#151922] border border-[#262D3D] p-4 rounded-2xl">
            <div>
              <h3 className="text-sm font-bold text-white">Inspeksi & Quality Control Kendaraan</h3>
              <p className="text-xs text-[#9CA3AF]">Pemeriksaan 8 sektor utama sebelum unit dipasarkan.</p>
            </div>
            <button onClick={() => setModalOpen(true)} className="px-4 py-2 rounded-xl bg-[#2563EB] text-xs font-semibold text-white flex items-center gap-2"><Icon name="plus" className="w-4 h-4" /> Buat Laporan Inspeksi</button>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
            {(dbState.inspections || []).map(ins => (
              <div key={ins.id} className="bg-[#1B202B] border border-[#262D3D] rounded-2xl p-5 space-y-4">
                <div className="flex items-start justify-between">
                  <div>
                    <span className="text-xs font-bold text-[#60A5FA]">{ins.id} • {formatDateID(ins.date)}</span>
                    <h4 className="text-base font-bold text-white mt-0.5">{ins.carName}</h4>
                    <p className="text-xs text-[#9CA3AF]">Pemeriksa: {ins.inspector}</p>
                  </div>
                  <button onClick={() => printDocumentReceipt("Laporan Inspeksi Kendaraan", ins.id, ins.date, "Unit Kendaraan", ins.carName, checkFields.map(([k, lbl]) => [lbl, `Pemeriksa: ${ins.inspector}`, ins[k]]), [["Rekomendasi", ins.recommendation || "-"]], ins.notes)} className="p-2 rounded-xl bg-[#151922] border border-[#262D3D] text-[#60A5FA]" title="Cetak Hasil Inspeksi"><Icon name="printer" className="w-4 h-4" /></button>
                </div>
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs">
                  {checkFields.map(([key, label]) => (
                    <div key={key} className="p-2.5 rounded-xl bg-[#151922] border border-[#262D3D]">
                      <div className="text-[11px] text-[#9CA3AF] mb-1">{label}</div>
                      <StatusBadge status={ins[key]} />
                    </div>
                  ))}
                </div>
                <div className="p-3 rounded-xl bg-[#151922] border border-[#262D3D] text-xs">
                  <div className="text-[#9CA3AF] font-semibold">Rekomendasi & Catatan:</div>
                  <div className="text-white mt-0.5">{ins.recommendation || "-"} {ins.notes ? `(${ins.notes})` : ""}</div>
                </div>
              </div>
            ))}
          </div>

          <Modal open={modalOpen} onClose={() => setModalOpen(false)} title="Formulir Inspeksi Kendaraan" maxWidth="max-w-3xl">
            <form onSubmit={handleSaveInspection} className="space-y-4 text-xs">
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div><label className="block text-[#9CA3AF] mb-1">Pilih Kendaraan</label><select value={form.carId} onChange={(e) => setForm({ ...form, carId: e.target.value })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white">{(dbState.cars || []).map(c => <option key={c.id} value={c.id}>{c.id} — {c.brand} {c.model}</option>)}</select></div>
                <div><label className="block text-[#9CA3AF] mb-1">Tanggal Inspeksi</label><input type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white" /></div>
                <div><label className="block text-[#9CA3AF] mb-1">Update Status Unit Setelah QC</label><select value={form.updateCarStatus} onChange={(e) => setForm({ ...form, updateCarStatus: e.target.value })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white"><option value="Siap Dijual">Siap Dijual</option><option value="Menunggu Perbaikan">Menunggu Perbaikan</option><option value="Dalam Perbaikan">Dalam Perbaikan</option></select></div>
              </div>
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                {checkFields.map(([key, label]) => (
                  <div key={key}>
                    <label className="block text-[#9CA3AF] mb-1">{label}</label>
                    <select value={form[key]} onChange={(e) => setForm({ ...form, [key]: e.target.value })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2 text-white"><option value="Baik">Baik</option><option value="Perlu Perhatian">Perlu Perhatian</option><option value="Perlu Perbaikan">Perlu Perbaikan</option></select>
                  </div>
                ))}
              </div>
              <div><label className="block text-[#9CA3AF] mb-1">Rekomendasi Perbaikan</label><input type="text" value={form.recommendation} onChange={(e) => setForm({ ...form, recommendation: e.target.value })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white" /></div>
              <div className="flex justify-end gap-3">
                <button type="button" onClick={() => setModalOpen(false)} className="px-4 py-2 rounded-xl bg-[#151922] border border-[#262D3D] text-[#9CA3AF]">Batal</button>
                <button type="submit" className="px-5 py-2 rounded-xl bg-[#2563EB] text-white font-semibold">Simpan Hasil Inspeksi</button>
              </div>
            </form>
          </Modal>
        </div>
      );
    }

    function MaintenanceModule({ dbState, setDbState, currentUser, appendAuditLog }) {
      const [modalOpen, setModalOpen] = useState(false);
      const [form, setForm] = useState({
        carId: dbState.cars?.[0]?.id || "", type: "Servis Berkala & Detailing",
        workshop: "Autovia Detailing Bay", technician: "Riko Saputra",
        entryDate: todayISO(), targetDate: todayISO(), serviceCost: 0, partsCost: 0,
        status: "Dalam Pengerjaan", addToCapital: true, notes: ""
      });

      const handleSaveMaintenance = (e) => {
        e.preventDefault();
        const car = (dbState.cars || []).find(c => c.id === form.carId);
        const totalCost = (Number(form.serviceCost) || 0) + (Number(form.partsCost) || 0);
        const mntId = `MNT-2026-${String((dbState.maintenance?.length || 0) + 1).padStart(3, "0")}`;
        const newMnt = { ...form, id: mntId, carName: car ? `${car.brand} ${car.model} (${car.plateNumber})` : form.carId, totalCost };

        setDbState(prev => ({
          ...prev,
          maintenance: [newMnt, ...prev.maintenance],
          cars: prev.cars.map(c => {
            if (c.id !== form.carId) return c;
            const addedCost = form.addToCapital ? totalCost : 0;
            return { ...c, extraCost: (Number(c.extraCost) || 0) + addedCost, status: form.status === "Selesai" ? "Siap Dijual" : "Dalam Perbaikan", history: [{ date: todayISO(), action: `Perawatan ${mntId} (${formatIDR(totalCost)}) ditambahkan`, user: currentUser.name }, ...(c.history || [])] };
          }),
          cashTransactions: totalCost > 0 ? [{ id: `CSH-${Date.now().toString().slice(-4)}`, date: form.entryDate, type: "Kas Keluar", category: "Perawatan Kendaraan", description: `Biaya perawatan ${mntId} (${newMnt.carName})`, method: "Transfer Bank BCA", amount: totalCost }, ...prev.cashTransactions] : prev.cashTransactions
        }));

        appendAuditLog("Perawatan", `Mencatat perawatan ${mntId} senilai ${formatIDR(totalCost)}`, form.carId);
        setModalOpen(false);
        Swal.fire({ icon: "success", title: "Data Perawatan Tersimpan", text: "Biaya perawatan otomatis ditambahkan ke HPP / modal kendaraan.", timer: 1800, showConfirmButton: false });
      };

      const handleCompleteMaintenance = (mnt) => {
        setDbState(prev => ({
          ...prev,
          maintenance: prev.maintenance.map(m => m.id === mnt.id ? { ...m, status: "Selesai", finishDate: todayISO() } : m),
          cars: prev.cars.map(c => c.id === mnt.carId ? { ...c, status: "Siap Dijual" } : c)
        }));
        appendAuditLog("Perawatan", `Menyelesaikan perawatan ${mnt.id}`, mnt.carId);
      };

      return (
        <div className="space-y-6">
          <div className="flex flex-wrap items-center justify-between gap-4 bg-[#151922] border border-[#262D3D] p-4 rounded-2xl">
            <div>
              <h3 className="text-sm font-bold text-white">Perawatan, Rekondisi & Bengkel</h3>
              <p className="text-xs text-[#9CA3AF]">Biaya jasa dan suku cadang otomatis terakumulasi ke total modal unit.</p>
            </div>
            <div className="flex gap-2">
              <button onClick={() => exportToExcel(dbState.maintenance, "AUTOVIA_Perawatan")} className="px-3.5 py-2 rounded-xl bg-[#1B202B] border border-[#262D3D] text-xs font-semibold text-white flex items-center gap-2"><Icon name="file-spreadsheet" className="w-4 h-4 text-[#22C55E]" /> Export Excel</button>
              <button onClick={() => setModalOpen(true)} className="px-4 py-2 rounded-xl bg-[#2563EB] text-xs font-semibold text-white flex items-center gap-2"><Icon name="plus" className="w-4 h-4" /> Tambah Perawatan</button>
            </div>
          </div>

          <div className="bg-[#1B202B] border border-[#262D3D] rounded-2xl overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-left border-collapse text-xs">
                <thead>
                  <tr className="bg-[#151922] border-b border-[#262D3D] text-[11px] font-bold uppercase text-[#9CA3AF]">
                    <th className="py-3.5 px-4">ID & Tanggal</th>
                    <th className="py-3.5 px-4">Kendaraan</th>
                    <th className="py-3.5 px-4">Jenis & Bengkel</th>
                    <th className="py-3.5 px-4 text-right">Biaya Jasa</th>
                    <th className="py-3.5 px-4 text-right">Suku Cadang</th>
                    <th className="py-3.5 px-4 text-right">Total Biaya</th>
                    <th className="py-3.5 px-4">Status</th>
                    <th className="py-3.5 px-4 text-right">Aksi</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-[#262D3D]">
                  {(dbState.maintenance || []).map(m => (
                    <tr key={m.id} className="hover:bg-[#151922]/60">
                      <td className="py-3.5 px-4"><div className="font-bold text-white">{m.id}</div><div className="text-[11px] text-[#9CA3AF]">Masuk: {formatDateID(m.entryDate)}</div></td>
                      <td className="py-3.5 px-4 font-semibold text-white">{m.carName}</td>
                      <td className="py-3.5 px-4"><div className="text-white">{m.type}</div><div className="text-[11px] text-[#9CA3AF]">{m.workshop} ({m.technician})</div></td>
                      <td className="py-3.5 px-4 text-right text-[#9CA3AF]">{formatIDR(m.serviceCost)}</td>
                      <td className="py-3.5 px-4 text-right text-[#9CA3AF]">{formatIDR(m.partsCost)}</td>
                      <td className="py-3.5 px-4 text-right font-bold text-white">{formatIDR(m.totalCost)}</td>
                      <td className="py-3.5 px-4"><StatusBadge status={m.status} /></td>
                      <td className="py-3.5 px-4 text-right">
                        {m.status !== "Selesai" && (<button onClick={() => handleCompleteMaintenance(m)} className="px-3 py-1.5 rounded-lg bg-[#22C55E]/15 text-[#22C55E] border border-[#22C55E]/30 font-semibold">Selesaikan</button>)}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          <Modal open={modalOpen} onClose={() => setModalOpen(false)} title="Input Perawatan & Perbaikan Kendaraan" maxWidth="max-w-2xl">
            <form onSubmit={handleSaveMaintenance} className="space-y-4 text-xs">
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div><label className="block text-[#9CA3AF] mb-1">Kendaraan</label><select value={form.carId} onChange={(e) => setForm({ ...form, carId: e.target.value })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white">{(dbState.cars || []).filter(c => c.status !== "Terjual").map(c => <option key={c.id} value={c.id}>{c.id} — {c.brand} {c.model}</option>)}</select></div>
                <div><label className="block text-[#9CA3AF] mb-1">Jenis Perawatan</label><input required type="text" value={form.type} onChange={(e) => setForm({ ...form, type: e.target.value })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white" /></div>
                <div><label className="block text-[#9CA3AF] mb-1">Nama Bengkel</label><input type="text" value={form.workshop} onChange={(e) => setForm({ ...form, workshop: e.target.value })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white" /></div>
                <div><label className="block text-[#9CA3AF] mb-1">Teknisi</label><input type="text" value={form.technician} onChange={(e) => setForm({ ...form, technician: e.target.value })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white" /></div>
                <div><label className="block text-[#9CA3AF] mb-1">Biaya Jasa (Rp)</label><input type="number" value={form.serviceCost} onChange={(e) => setForm({ ...form, serviceCost: Number(e.target.value) })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white" /></div>
                <div><label className="block text-[#9CA3AF] mb-1">Biaya Suku Cadang (Rp)</label><input type="number" value={form.partsCost} onChange={(e) => setForm({ ...form, partsCost: Number(e.target.value) })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white" /></div>
              </div>
              <label className="flex items-center gap-2 text-white font-medium"><input type="checkbox" checked={form.addToCapital} onChange={(e) => setForm({ ...form, addToCapital: e.target.checked })} /><span>Tambahkan total biaya otomatis ke Modal Kendaraan (HPP)</span></label>
              <div className="flex justify-end gap-3">
                <button type="button" onClick={() => setModalOpen(false)} className="px-4 py-2 rounded-xl bg-[#151922] border border-[#262D3D] text-[#9CA3AF]">Batal</button>
                <button type="submit" className="px-5 py-2 rounded-xl bg-[#2563EB] text-white font-semibold">Simpan Perawatan</button>
              </div>
            </form>
          </Modal>
        </div>
      );
    }

    function SalesModule({ dbState, setDbState, currentUser, appendAuditLog, pushNotification }) {
      const [modalOpen, setModalOpen] = useState(false);
      const [selectedSaleDetail, setSelectedSaleDetail] = useState(null);

      const availableCarsForSale = (dbState.cars || []).filter(c => !["Terjual", "Tidak Aktif"].includes(c.status));
      const [form, setForm] = useState({
        date: todayISO(), carId: availableCarsForSale[0]?.id || "", customerId: dbState.customers?.[0]?.id || "",
        salesStaff: currentUser.name, sellPrice: availableCarsForSale[0]?.sellPrice || 0, discount: 0,
        extraFee: 0, sellingExpense: 0, paymentMethod: "Transfer Bank BCA", paidAmount: 0,
        dueDate: todayISO(), notes: ""
      });

      const handleSelectCarForSale = (carId) => {
        const c = (dbState.cars || []).find(item => item.id === carId);
        setForm(prev => ({ ...prev, carId, sellPrice: c ? c.sellPrice : 0 }));
      };

      const selectedCarObj = (dbState.cars || []).find(c => c.id === form.carId);
      const carCapital = selectedCarObj ? (Number(selectedCarObj.buyPrice) + Number(selectedCarObj.extraCost)) : 0;
      const totalTx = Math.max(0, (Number(form.sellPrice) || 0) - (Number(form.discount) || 0) + (Number(form.extraFee) || 0));
      const grossProfit = totalTx - carCapital;
      const netProfit = grossProfit - (Number(form.sellingExpense) || 0);

      const handleCreateSale = (e) => {
        e.preventDefault();
        if (!form.carId || !form.customerId) { Swal.fire("Validasi", "Pilih kendaraan dan pelanggan terlebih dahulu.", "warning"); return; }
        const cust = (dbState.customers || []).find(c => c.id === form.customerId);
        const paid = Number(form.paidAmount) || 0;
        const remaining = Math.max(0, totalTx - paid);
        const status = remaining === 0 ? "Lunas" : paid > 0 ? "DP Diterima" : "Menunggu Pembayaran";

        const invId = `INV-2026-${String((dbState.sales?.length || 0) + 1).padStart(3, "0")}`;
        const newSale = {
          id: invId, date: form.date, carId: form.carId,
          carName: selectedCarObj ? `${selectedCarObj.brand} ${selectedCarObj.model} ${selectedCarObj.year}` : form.carId,
          customerId: form.customerId, customerName: cust ? cust.name : "Pelanggan",
          salesStaff: form.salesStaff, sellPrice: Number(form.sellPrice) || 0,
          discount: Number(form.discount) || 0, extraFee: Number(form.extraFee) || 0,
          sellingExpense: Number(form.sellingExpense) || 0, totalTransaction: totalTx,
          paymentMethod: form.paymentMethod, downPayment: paid, paidAmount: paid,
          remainingAmount: remaining, dueDate: form.dueDate, status, notes: form.notes
        };

        const nextCarStatus = status === "Lunas" ? "Terjual" : "Dibooking";

        setDbState(prev => ({
          ...prev,
          sales: [newSale, ...prev.sales],
          cars: prev.cars.map(c => c.id === form.carId ? { ...c, status: nextCarStatus, history: [{ date: form.date, action: `Transaksi ${invId} (${status}) -> Unit ${nextCarStatus}`, user: currentUser.name }, ...(c.history || [])] } : c),
          payments: paid > 0 ? [{ id: `PAY-2026-${String((prev.payments?.length || 0) + 1).padStart(3, "0")}`, saleId: invId, customerName: newSale.customerName, carName: newSale.carName, date: form.date, type: remaining === 0 ? "Pelunasan" : "Pembayaran DP", method: form.paymentMethod, amount: paid, notes: `Pembayaran awal transaksi ${invId}` }, ...prev.payments] : prev.payments,
          cashTransactions: paid > 0 ? [{ id: `CSH-${Date.now().toString().slice(-4)}`, date: form.date, type: "Kas Masuk", category: "Penjualan Kendaraan", description: `Penerimaan ${invId} (${newSale.carName})`, method: form.paymentMethod, amount: paid }, ...prev.cashTransactions] : prev.cashTransactions
        }));

        appendAuditLog("Penjualan", `Membuat transaksi penjualan ${invId} (${status})`, invId);
        pushNotification("Transaksi Penjualan Baru", `${invId} oleh ${newSale.customerName} (${formatIDR(totalTx)}) - Status: ${status}.`, "sales");
        setModalOpen(false);
        Swal.fire({ icon: "success", title: "Transaksi Penjualan Disimpan", text: `Invoice ${invId} berhasil dibuat.`, timer: 1800, showConfirmButton: false });
      };

      return (
        <div className="space-y-6">
          <div className="flex flex-wrap items-center justify-between gap-4 bg-[#151922] border border-[#262D3D] p-4 rounded-2xl">
            <div>
              <h3 className="text-sm font-bold text-white">Transaksi Penjualan & Kalkulasi Laba Bersih</h3>
              <p className="text-xs text-[#9CA3AF]">Unit otomatis berubah menjadi Terjual hanya setelah transaksi berstatus Lunas.</p>
            </div>
            <div className="flex gap-2">
              <button onClick={() => exportToExcel(dbState.sales, "AUTOVIA_Penjualan")} className="px-3.5 py-2 rounded-xl bg-[#1B202B] border border-[#262D3D] text-xs font-semibold text-white flex items-center gap-2"><Icon name="file-spreadsheet" className="w-4 h-4 text-[#22C55E]" /> Export Excel</button>
              <button onClick={() => setModalOpen(true)} className="px-4 py-2 rounded-xl bg-[#2563EB] text-xs font-semibold text-white flex items-center gap-2"><Icon name="plus" className="w-4 h-4" /> Buat Transaksi Penjualan</button>
            </div>
          </div>

          <div className="bg-[#1B202B] border border-[#262D3D] rounded-2xl overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-left border-collapse text-xs">
                <thead>
                  <tr className="bg-[#151922] border-b border-[#262D3D] text-[11px] font-bold uppercase text-[#9CA3AF]">
                    <th className="py-3.5 px-4">Invoice & Tgl</th>
                    <th className="py-3.5 px-4">Pelanggan & Sales</th>
                    <th className="py-3.5 px-4">Unit Kendaraan</th>
                    <th className="py-3.5 px-4 text-right">Total Transaksi</th>
                    <th className="py-3.5 px-4 text-right">Profit Bersih</th>
                    <th className="py-3.5 px-4 text-right">Sisa Tagihan</th>
                    <th className="py-3.5 px-4">Status</th>
                    <th className="py-3.5 px-4 text-right">Aksi</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-[#262D3D]">
                  {(dbState.sales || []).map(sale => {
                    const car = (dbState.cars || []).find(c => c.id === sale.carId);
                    const modal = car ? (Number(car.buyPrice) + Number(car.extraCost)) : 0;
                    const profit = (Number(sale.totalTransaction) || 0) - modal - (Number(sale.sellingExpense) || 0);
                    return (
                      <tr key={sale.id} className="hover:bg-[#151922]/60">
                        <td className="py-3.5 px-4"><div className="font-bold text-white">{sale.id}</div><div className="text-[11px] text-[#9CA3AF]">{formatDateID(sale.date)}</div></td>
                        <td className="py-3.5 px-4"><div className="font-semibold text-white">{sale.customerName}</div><div className="text-[11px] text-[#9CA3AF]">Sales: {sale.salesStaff}</div></td>
                        <td className="py-3.5 px-4 text-white font-medium">{sale.carName}</td>
                        <td className="py-3.5 px-4 text-right font-bold text-white">{formatIDR(sale.totalTransaction)}</td>
                        <td className="py-3.5 px-4 text-right font-bold text-[#22C55E]">{formatIDR(profit)}</td>
                        <td className="py-3.5 px-4 text-right font-semibold text-[#F59E0B]">{formatIDR(sale.remainingAmount)}</td>
                        <td className="py-3.5 px-4"><StatusBadge status={sale.status} /></td>
                        <td className="py-3.5 px-4 text-right">
                          <div className="inline-flex gap-1.5">
                            <button onClick={() => setSelectedSaleDetail({ sale, modal, profit })} title="Rincian Keuntungan" className="p-2 rounded-lg bg-[#151922] text-[#60A5FA] border border-[#262D3D]"><Icon name="eye" className="w-3.5 h-3.5" /></button>
                            <button onClick={() => printDocumentReceipt("Invoice Penjualan", sale.id, sale.date, "Kepada Yth. Pelanggan", sale.customerName, [[sale.carName, `Metode: ${sale.paymentMethod}`, formatIDR(sale.sellPrice)], ["Diskon Penjualan", "-", `-${formatIDR(sale.discount)}`], ["Biaya Tambahan (BBN / Asuransi)", "-", formatIDR(sale.extraFee)]], [["Total Transaksi", formatIDR(sale.totalTransaction)], ["Total Pembayaran Diterima", formatIDR(sale.paidAmount)], ["Sisa Tagihan", formatIDR(sale.remainingAmount)]], sale.notes)} title="Cetak Invoice PDF" className="p-2 rounded-lg bg-[#151922] text-[#22C55E] border border-[#262D3D]"><Icon name="printer" className="w-3.5 h-3.5" /></button>
                          </div>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>

          <Modal open={modalOpen} onClose={() => setModalOpen(false)} title="Buat Transaksi Penjualan Baru" maxWidth="max-w-3xl">
            <form onSubmit={handleCreateSale} className="space-y-4 text-xs">
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div><label className="block text-[#9CA3AF] mb-1">Tanggal Transaksi</label><input type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white" /></div>
                <div><label className="block text-[#9CA3AF] mb-1">Kendaraan Tersedia *</label><select value={form.carId} onChange={(e) => handleSelectCarForSale(e.target.value)} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white"><option value="">-- Pilih Unit --</option>{availableCarsForSale.map(c => <option key={c.id} value={c.id}>{c.id} — {c.brand} {c.model} ({c.plateNumber})</option>)}</select></div>
                <div><label className="block text-[#9CA3AF] mb-1">Pelanggan *</label><select value={form.customerId} onChange={(e) => setForm({ ...form, customerId: e.target.value })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white">{(dbState.customers || []).map(c => <option key={c.id} value={c.id}>{c.name} ({c.phone})</option>)}</select></div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-4 gap-3">
                <div><label className="block text-[#9CA3AF] mb-1">Harga Jual (Rp)</label><input type="number" value={form.sellPrice} onChange={(e) => setForm({ ...form, sellPrice: Number(e.target.value) })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2 text-white" /></div>
                <div><label className="block text-[#9CA3AF] mb-1">Diskon (Rp)</label><input type="number" value={form.discount} onChange={(e) => setForm({ ...form, discount: Number(e.target.value) })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2 text-white" /></div>
                <div><label className="block text-[#9CA3AF] mb-1">Biaya Tambahan (BBN/dll)</label><input type="number" value={form.extraFee} onChange={(e) => setForm({ ...form, extraFee: Number(e.target.value) })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2 text-white" /></div>
                <div><label className="block text-[#9CA3AF] mb-1">Biaya Penjualan / Komisi</label><input type="number" value={form.sellingExpense} onChange={(e) => setForm({ ...form, sellingExpense: Number(e.target.value) })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2 text-white" /></div>
              </div>

              <div className="p-4 rounded-xl bg-[#151922] border border-[#262D3D] grid grid-cols-2 sm:grid-cols-4 gap-3">
                <div><span className="text-[#9CA3AF] block">Total Modal Unit</span><strong className="text-white text-sm">{formatIDR(carCapital)}</strong></div>
                <div><span className="text-[#9CA3AF] block">Total Transaksi</span><strong className="text-[#60A5FA] text-sm">{formatIDR(totalTx)}</strong></div>
                <div><span className="text-[#9CA3AF] block">Keuntungan Kotor</span><strong className="text-white text-sm">{formatIDR(grossProfit)}</strong></div>
                <div><span className="text-[#9CA3AF] block">Keuntungan Bersih</span><strong className={`text-sm ${netProfit >= 0 ? "text-[#22C55E]" : "text-[#EF4444]"}`}>{formatIDR(netProfit)}</strong></div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div><label className="block text-[#9CA3AF] mb-1">Metode Pembayaran</label><select value={form.paymentMethod} onChange={(e) => setForm({ ...form, paymentMethod: e.target.value })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white">{(dbState.settings?.paymentMethods || []).map(m => <option key={m} value={m}>{m}</option>)}</select></div>
                <div><label className="block text-[#9CA3AF] mb-1">Pembayaran Diterima (DP / Lunas)</label><input type="number" value={form.paidAmount} onChange={(e) => setForm({ ...form, paidAmount: Number(e.target.value) })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white" /></div>
                <div><label className="block text-[#9CA3AF] mb-1">Jatuh Tempo Pelunasan</label><input type="date" value={form.dueDate} onChange={(e) => setForm({ ...form, dueDate: e.target.value })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white" /></div>
              </div>

              <div className="flex justify-end gap-3 pt-2">
                <button type="button" onClick={() => setModalOpen(false)} className="px-4 py-2 rounded-xl bg-[#151922] border border-[#262D3D] text-[#9CA3AF]">Batal</button>
                <button type="submit" className="px-5 py-2 rounded-xl bg-[#2563EB] text-white font-semibold">Simpan Transaksi</button>
              </div>
            </form>
          </Modal>

          <Modal open={Boolean(selectedSaleDetail)} onClose={() => setSelectedSaleDetail(null)} title={selectedSaleDetail ? `Rincian Transaksi ${selectedSaleDetail.sale.id}` : ""} maxWidth="max-w-lg">
            {selectedSaleDetail && (
              <div className="space-y-3 text-xs">
                <div className="p-4 rounded-xl bg-[#151922] border border-[#262D3D] space-y-2">
                  <div className="flex justify-between"><span className="text-[#9CA3AF]">Harga Jual Kesepakatan</span><strong className="text-white">{formatIDR(selectedSaleDetail.sale.sellPrice)}</strong></div>
                  <div className="flex justify-between"><span className="text-[#9CA3AF]">Diskon</span><span className="text-rose-400">-{formatIDR(selectedSaleDetail.sale.discount)}</span></div>
                  <div className="flex justify-between"><span className="text-[#9CA3AF]">Biaya Tambahan</span><span className="text-white">{formatIDR(selectedSaleDetail.sale.extraFee)}</span></div>
                  <div className="flex justify-between border-t border-[#262D3D] pt-2"><span className="font-bold text-white">Total Transaksi</span><strong className="text-[#60A5FA]">{formatIDR(selectedSaleDetail.sale.totalTransaction)}</strong></div>
                  <div className="flex justify-between"><span className="text-[#9CA3AF]">Total Modal Kendaraan (HPP)</span><span className="text-white">-{formatIDR(selectedSaleDetail.modal)}</span></div>
                  <div className="flex justify-between"><span className="text-[#9CA3AF]">Biaya Penjualan / Komisi</span><span className="text-rose-400">-{formatIDR(selectedSaleDetail.sale.sellingExpense)}</span></div>
                  <div className="flex justify-between border-t border-[#262D3D] pt-2 text-sm"><span className="font-bold text-white">Keuntungan Bersih</span><strong className="text-[#22C55E]">{formatIDR(selectedSaleDetail.profit)}</strong></div>
                </div>
              </div>
            )}
          </Modal>
        </div>
