    function PaymentsReceivablesModule({ dbState, setDbState, defaultTab, appendAuditLog, pushNotification }) {
      const [tab, setTab] = useState(defaultTab || "payments");
      const [payModal, setPayModal] = useState(false);

      const unpaidSales = (dbState.sales || []).filter(s => s.status !== "Dibatalkan" && Number(s.remainingAmount) > 0);
      const [form, setForm] = useState({
        saleId: unpaidSales[0]?.id || "", date: todayISO(), type: "Pelunasan",
        method: "Transfer Bank BCA", amount: unpaidSales[0]?.remainingAmount || 0, notes: ""
      });

      const handleAddPayment = (e) => {
        e.preventDefault();
        const sale = (dbState.sales || []).find(s => s.id === form.saleId);
        if (!sale) return;
        const payAmt = Number(form.amount) || 0;
        const newRemaining = Math.max(0, (Number(sale.remainingAmount) || 0) - payAmt);
        const newSaleStatus = newRemaining === 0 ? "Lunas" : "Pembayaran Sebagian";

        const payId = `PAY-2026-${String((dbState.payments?.length || 0) + 1).padStart(3, "0")}`;
        const newPay = { id: payId, saleId: sale.id, customerName: sale.customerName, carName: sale.carName, date: form.date, type: newRemaining === 0 ? "Pelunasan" : form.type, method: form.method, amount: payAmt, notes: form.notes };

        setDbState(prev => ({
          ...prev,
          payments: [newPay, ...prev.payments],
          sales: prev.sales.map(s => s.id === sale.id ? { ...s, paidAmount: (Number(s.paidAmount) || 0) + payAmt, remainingAmount: newRemaining, status: newSaleStatus } : s),
          cars: newRemaining === 0 ? prev.cars.map(c => c.id === sale.carId ? { ...c, status: "Terjual" } : c) : prev.cars,
          cashTransactions: [{ id: `CSH-${Date.now().toString().slice(-4)}`, date: form.date, type: "Kas Masuk", category: "Pelunasan Piutang", description: `${payId} untuk ${sale.id} (${sale.customerName})`, method: form.method, amount: payAmt }, ...prev.cashTransactions]
        }));

        appendAuditLog("Pembayaran", `Menerima pembayaran ${payId} senilai ${formatIDR(payAmt)}`, sale.id);
        pushNotification("Pembayaran Masuk", `${sale.customerName} membayar ${formatIDR(payAmt)} untuk ${sale.id}.`, "payments");
        setPayModal(false);
        Swal.fire({ icon: "success", title: "Pembayaran Dicatat", timer: 1500, showConfirmButton: false });
      };

      return (
        <div className="space-y-6">
          <div className="flex flex-wrap items-center justify-between gap-4 bg-[#151922] border border-[#262D3D] p-4 rounded-2xl">
            <div className="flex gap-2">
              <button onClick={() => setTab("payments")} className={`px-4 py-2 rounded-xl text-xs font-semibold ${tab === "payments" ? "bg-[#2563EB] text-white" : "bg-[#1B202B] text-[#9CA3AF]"}`}>Riwayat Pembayaran ({dbState.payments?.length || 0})</button>
              <button onClick={() => setTab("receivables")} className={`px-4 py-2 rounded-xl text-xs font-semibold ${tab === "receivables" ? "bg-[#2563EB] text-white" : "bg-[#1B202B] text-[#9CA3AF]"}`}>Monitoring Piutang ({unpaidSales.length})</button>
            </div>
            {unpaidSales.length > 0 && (<button onClick={() => { setForm({ ...form, saleId: unpaidSales[0].id, amount: unpaidSales[0].remainingAmount }); setPayModal(true); }} className="px-4 py-2 rounded-xl bg-[#2563EB] text-xs font-semibold text-white flex items-center gap-2"><Icon name="plus" className="w-4 h-4" /> Input Pembayaran / Pelunasan</button>)}
          </div>

          {tab === "payments" ? (
            <div className="bg-[#1B202B] border border-[#262D3D] rounded-2xl overflow-hidden">
              <table className="w-full text-left border-collapse text-xs">
                <thead>
                  <tr className="bg-[#151922] border-b border-[#262D3D] text-[11px] font-bold uppercase text-[#9CA3AF]">
                    <th className="py-3.5 px-4">ID Pembayaran</th>
                    <th className="py-3.5 px-4">No. Invoice</th>
                    <th className="py-3.5 px-4">Pelanggan & Unit</th>
                    <th className="py-3.5 px-4">Jenis & Metode</th>
                    <th className="py-3.5 px-4 text-right">Nominal</th>
                    <th className="py-3.5 px-4 text-right">Kuitansi</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-[#262D3D]">
                  {(dbState.payments || []).map(p => (
                    <tr key={p.id}>
                      <td className="py-3.5 px-4 font-bold text-white">{p.id}<div className="text-[11px] text-[#9CA3AF] font-normal">{formatDateID(p.date)}</div></td>
                      <td className="py-3.5 px-4 text-[#60A5FA] font-semibold">{p.saleId}</td>
                      <td className="py-3.5 px-4"><div className="text-white font-semibold">{p.customerName}</div><div className="text-[11px] text-[#9CA3AF]">{p.carName}</div></td>
                      <td className="py-3.5 px-4"><StatusBadge status={p.type} /><div className="text-[11px] text-[#9CA3AF] mt-1">{p.method}</div></td>
                      <td className="py-3.5 px-4 text-right font-bold text-[#22C55E]">{formatIDR(p.amount)}</td>
                      <td className="py-3.5 px-4 text-right">
                        <button onClick={() => printDocumentReceipt("Kuitansi Pembayaran", p.id, p.date, "Telah Diterima Dari", p.customerName, [[`${p.type} — ${p.carName}`, `Ref: ${p.saleId} (${p.method})`, formatIDR(p.amount)]], [["Total Diterima", formatIDR(p.amount)]], p.notes)} className="p-2 rounded-lg bg-[#151922] border border-[#262D3D] text-[#60A5FA]"><Icon name="printer" className="w-3.5 h-3.5" /></button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          ) : (
            <div className="bg-[#1B202B] border border-[#262D3D] rounded-2xl overflow-hidden">
              <table className="w-full text-left border-collapse text-xs">
                <thead>
                  <tr className="bg-[#151922] border-b border-[#262D3D] text-[11px] font-bold uppercase text-[#9CA3AF]">
                    <th className="py-3.5 px-4">Pelanggan</th>
                    <th className="py-3.5 px-4">No. Transaksi & Unit</th>
                    <th className="py-3.5 px-4 text-right">Total Transaksi</th>
                    <th className="py-3.5 px-4 text-right">Sudah Dibayar</th>
                    <th className="py-3.5 px-4 text-right">Sisa Piutang</th>
                    <th className="py-3.5 px-4">Jatuh Tempo</th>
                    <th className="py-3.5 px-4">Status</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-[#262D3D]">
                  {unpaidSales.map(s => {
                    const isOverdue = s.dueDate && s.dueDate < todayISO();
                    return (
                      <tr key={s.id}>
                        <td className="py-3.5 px-4 font-bold text-white">{s.customerName}</td>
                        <td className="py-3.5 px-4"><div className="text-[#60A5FA] font-semibold">{s.id}</div><div className="text-[11px] text-[#9CA3AF]">{s.carName}</div></td>
                        <td className="py-3.5 px-4 text-right text-white">{formatIDR(s.totalTransaction)}</td>
                        <td className="py-3.5 px-4 text-right text-[#22C55E]">{formatIDR(s.paidAmount)}</td>
                        <td className="py-3.5 px-4 text-right font-bold text-[#F59E0B]">{formatIDR(s.remainingAmount)}</td>
                        <td className="py-3.5 px-4 text-white">{formatDateID(s.dueDate)}</td>
                        <td className="py-3.5 px-4"><StatusBadge status={isOverdue ? "Terlambat" : s.status} /></td>
                      </tr>
                    );
                  })}
                  {!unpaidSales.length && (<tr><td colSpan="7" className="py-8 text-center text-[#9CA3AF]">Seluruh transaksi penjualan sudah lunas.</td></tr>)}
                </tbody>
              </table>
            </div>
          )}

          <Modal open={payModal} onClose={() => setPayModal(false)} title="Input Pembayaran Pelanggan" maxWidth="max-w-lg">
            <form onSubmit={handleAddPayment} className="space-y-4 text-xs">
              <div>
                <label className="block text-[#9CA3AF] mb-1">Pilih Transaksi Piutang</label>
                <select value={form.saleId} onChange={(e) => { const s = unpaidSales.find(item => item.id === e.target.value); setForm({ ...form, saleId: e.target.value, amount: s ? s.remainingAmount : 0 }); }} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white">
                  {unpaidSales.map(s => <option key={s.id} value={s.id}>{s.id} — {s.customerName} (Sisa: {formatIDR(s.remainingAmount)})</option>)}
                </select>
              </div>
              <div className="grid grid-cols-2 gap-3">
                <div><label className="block text-[#9CA3AF] mb-1">Tanggal Bayar</label><input type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white" /></div>
                <div><label className="block text-[#9CA3AF] mb-1">Metode Pembayaran</label><select value={form.method} onChange={(e) => setForm({ ...form, method: e.target.value })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white">{(dbState.settings?.paymentMethods || []).map(m => <option key={m} value={m}>{m}</option>)}</select></div>
              </div>
              <div><label className="block text-[#9CA3AF] mb-1">Nominal Pembayaran (Rp)</label><input required type="number" value={form.amount} onChange={(e) => setForm({ ...form, amount: Number(e.target.value) })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white font-bold" /></div>
              <div className="flex justify-end gap-3">
                <button type="button" onClick={() => setPayModal(false)} className="px-4 py-2 rounded-xl bg-[#151922] border border-[#262D3D] text-[#9CA3AF]">Batal</button>
                <button type="submit" className="px-5 py-2 rounded-xl bg-[#2563EB] text-white font-semibold">Simpan Pembayaran</button>
              </div>
            </form>
          </Modal>
        </div>
      );
    }

    function CashFinanceModule({ dbState, setDbState, metrics, filterType, appendAuditLog }) {
      const [modalOpen, setModalOpen] = useState(false);
      const [form, setForm] = useState({ date: todayISO(), type: "Kas Masuk", category: "Pendapatan Lainnya", description: "", method: "Transfer Bank BCA", amount: 0 });

      const filteredTx = (dbState.cashTransactions || []).filter(t => filterType === "Semua" || t.type === filterType);

      const handleRecordCash = (e) => {
        e.preventDefault();
        const amt = Number(form.amount) || 0;
        if (amt <= 0) return;
        const cshId = `CSH-${Date.now().toString().slice(-5)}`;
        setDbState(prev => ({ ...prev, cashTransactions: [{ id: cshId, ...form, amount: amt }, ...prev.cashTransactions] }));
        appendAuditLog("Kas & Keuangan", `Mencatat ${form.type} (${form.description}) senilai ${formatIDR(amt)}`, cshId);
        setModalOpen(false);
      };

      return (
        <div className="space-y-6">
          <div className="grid grid-cols-1 sm:grid-cols-4 gap-4">
            <div className="bg-[#1B202B] border border-[#262D3D] rounded-2xl p-4"><div className="text-xs text-[#9CA3AF]">Saldo Awal Kas</div><div className="text-lg font-extrabold text-white mt-1">{formatIDR(metrics.openingBalance)}</div></div>
            <div className="bg-[#1B202B] border border-[#262D3D] rounded-2xl p-4"><div className="text-xs text-[#9CA3AF]">Total Kas Masuk</div><div className="text-lg font-extrabold text-[#22C55E] mt-1">+{formatIDR(metrics.cashIn)}</div></div>
            <div className="bg-[#1B202B] border border-[#262D3D] rounded-2xl p-4"><div className="text-xs text-[#9CA3AF]">Total Kas Keluar</div><div className="text-lg font-extrabold text-[#EF4444] mt-1">-{formatIDR(metrics.cashOut)}</div></div>
            <div className="bg-[#1B202B] border border-[#2563EB]/50 rounded-2xl p-4"><div className="text-xs text-[#60A5FA] font-semibold">Saldo Akhir Terkini</div><div className="text-lg font-extrabold text-white mt-1">{formatIDR(metrics.currentCashBalance)}</div></div>
          </div>

          <div className="flex items-center justify-between bg-[#151922] border border-[#262D3D] p-4 rounded-2xl">
            <div className="text-xs text-[#9CA3AF]">Seluruh saldo dihitung otomatis dari mutasi transaksi yang tercatat.</div>
            <button onClick={() => setModalOpen(true)} className="px-4 py-2 rounded-xl bg-[#2563EB] text-xs font-semibold text-white flex items-center gap-2"><Icon name="plus" className="w-4 h-4" /> Catat Mutasi Kas</button>
          </div>

          <div className="bg-[#1B202B] border border-[#262D3D] rounded-2xl overflow-hidden">
            <table className="w-full text-left border-collapse text-xs">
              <thead>
                <tr className="bg-[#151922] border-b border-[#262D3D] text-[11px] font-bold uppercase text-[#9CA3AF]">
                  <th className="py-3.5 px-4">ID & Tanggal</th>
                  <th className="py-3.5 px-4">Arus</th>
                  <th className="py-3.5 px-4">Kategori</th>
                  <th className="py-3.5 px-4">Keterangan</th>
                  <th className="py-3.5 px-4">Metode</th>
                  <th className="py-3.5 px-4 text-right">Nominal</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-[#262D3D]">
                {filteredTx.map(tx => (
                  <tr key={tx.id}>
                    <td className="py-3.5 px-4 font-bold text-white">{tx.id}<div className="text-[11px] text-[#9CA3AF] font-normal">{formatDateID(tx.date)}</div></td>
                    <td className="py-3.5 px-4"><StatusBadge status={tx.type} /></td>
                    <td className="py-3.5 px-4 text-white">{tx.category}</td>
                    <td className="py-3.5 px-4 text-[#9CA3AF]">{tx.description}</td>
                    <td className="py-3.5 px-4 text-white">{tx.method}</td>
                    <td className={`py-3.5 px-4 text-right font-bold ${tx.type === "Kas Masuk" ? "text-[#22C55E]" : "text-[#EF4444]"}`}>{tx.type === "Kas Masuk" ? "+" : "-"}{formatIDR(tx.amount)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          <Modal open={modalOpen} onClose={() => setModalOpen(false)} title="Catat Transaksi Kas & Bank" maxWidth="max-w-lg">
            <form onSubmit={handleRecordCash} className="space-y-4 text-xs">
              <div className="grid grid-cols-2 gap-3">
                <div><label className="block text-[#9CA3AF] mb-1">Jenis Mutasi</label><select value={form.type} onChange={(e) => setForm({ ...form, type: e.target.value })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white"><option value="Kas Masuk">Kas Masuk</option><option value="Kas Keluar">Kas Keluar</option></select></div>
                <div><label className="block text-[#9CA3AF] mb-1">Tanggal</label><input type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white" /></div>
              </div>
              <div><label className="block text-[#9CA3AF] mb-1">Deskripsi Transaksi *</label><input required type="text" value={form.description} onChange={(e) => setForm({ ...form, description: e.target.value })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white" /></div>
              <div className="grid grid-cols-2 gap-3">
                <div><label className="block text-[#9CA3AF] mb-1">Metode</label><select value={form.method} onChange={(e) => setForm({ ...form, method: e.target.value })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white">{(dbState.settings?.paymentMethods || []).map(m => <option key={m} value={m}>{m}</option>)}</select></div>
                <div><label className="block text-[#9CA3AF] mb-1">Nominal (Rp)</label><input required type="number" value={form.amount} onChange={(e) => setForm({ ...form, amount: Number(e.target.value) })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white" /></div>
              </div>
              <div className="flex justify-end gap-3">
                <button type="button" onClick={() => setModalOpen(false)} className="px-4 py-2 rounded-xl bg-[#151922] border border-[#262D3D] text-[#9CA3AF]">Batal</button>
                <button type="submit" className="px-5 py-2 rounded-xl bg-[#2563EB] text-white font-semibold">Simpan Mutasi</button>
              </div>
            </form>
          </Modal>
        </div>
      );
    }

                  <th className="py-3.5 px-4">Metode</th>
                  <th className="py-3.5 px-4 text-right">Nominal</th>

                    <td className="py-3.5 px-4"><StatusBadge status={exp.category} /></td>
                    <td className="py-3.5 px-4"><div className="text-white font-semibold">{exp.description}</div><div className="text-[11px] text-[#9CA3AF]">Penerima: {exp.recipient} • Admin: {exp.adminName}</div></td>

              <div className="grid grid-cols-2 gap-3">

                <div><label className="block text-[#9CA3AF] mb-1">Kategori</label><select value={form.category} onChange={(e) => setForm({ ...form, category: e.target.value })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white">{categories.map(c => <option key={c} value={c}>{c}</option>)}</select></div>

    function PartnersSuppliersModule({ dbState, setDbState, defaultTab, appendAuditLog }) {
      const [tab, setTab] = useState(defaultTab || "suppliers");
      const [supModal, setSupModal] = useState(false);
      const [supForm, setSupForm] = useState({ name: "", contact: "", phone: "", email: "", address: "", type: "Dealer Rekanan", status: "Aktif", notes: "" });

      const unpaidPurchases = (dbState.purchases || []).filter(p => p.status !== "Dibatalkan" && Number(p.remainingAmount) > 0);

      const handleAddSupplier = (e) => {
        e.preventDefault();
        const id = `SUP-${String((dbState.suppliers?.length || 0) + 1).padStart(3, "0")}`;
        setDbState(prev => ({ ...prev, suppliers: [{ id, ...supForm }, ...prev.suppliers] }));
        appendAuditLog("Supplier", `Menambahkan supplier baru ${supForm.name}`, id);
        setSupModal(false);
      };

      const handlePaySupplierDebt = (po) => {
        Swal.fire({ title: "Lunasi Utang Supplier?", text: `Bayar sisa utang ${formatIDR(po.remainingAmount)} kepada ${po.sellerName}?`, icon: "question", showCancelButton: true, confirmButtonText: "Ya, Lunasi" })
          .then(res => {
            if (res.isConfirmed) {
              setDbState(prev => ({
                ...prev,
                purchases: prev.purchases.map(p => p.id === po.id ? { ...p, paidAmount: p.totalPurchase, remainingAmount: 0, status: "Lunas" } : p),
                cashTransactions: [{ id: `CSH-${Date.now().toString().slice(-4)}`, date: todayISO(), type: "Kas Keluar", category: "Pembayaran Utang Supplier", description: `Pelunasan ${po.id} ke ${po.sellerName}`, method: "Transfer Bank BCA", amount: po.remainingAmount }, ...prev.cashTransactions]
              }));
              appendAuditLog("Utang Supplier", `Melunasi utang ${po.id} ke ${po.sellerName}`, po.id);
            }
          });
      };

      return (
        <div className="space-y-6">
          <div className="flex flex-wrap items-center justify-between gap-3 bg-[#151922] border border-[#262D3D] p-4 rounded-2xl">
            <div className="flex gap-2">
              <button onClick={() => setTab("suppliers")} className={`px-4 py-2 rounded-xl text-xs font-semibold ${tab === "suppliers" ? "bg-[#2563EB] text-white" : "bg-[#1B202B] text-[#9CA3AF]"}`}>Data Supplier ({dbState.suppliers?.length || 0})</button>
              <button onClick={() => setTab("payables")} className={`px-4 py-2 rounded-xl text-xs font-semibold ${tab === "payables" ? "bg-[#2563EB] text-white" : "bg-[#1B202B] text-[#9CA3AF]"}`}>Monitoring Utang Supplier ({unpaidPurchases.length})</button>
              <button onClick={() => setTab("partners")} className={`px-4 py-2 rounded-xl text-xs font-semibold ${tab === "partners" ? "bg-[#2563EB] text-white" : "bg-[#1B202B] text-[#9CA3AF]"}`}>Mitra & Leasing ({dbState.partners?.length || 0})</button>
            </div>
            {tab === "suppliers" && (<button onClick={() => setSupModal(true)} className="px-4 py-2 rounded-xl bg-[#2563EB] text-xs font-semibold text-white flex items-center gap-2"><Icon name="plus" className="w-4 h-4" /> Tambah Supplier</button>)}
          </div>

          {tab === "suppliers" && (
            <div className="bg-[#1B202B] border border-[#262D3D] rounded-2xl overflow-hidden">
              <table className="w-full text-left border-collapse text-xs">
                <thead>
                  <tr className="bg-[#151922] border-b border-[#262D3D] text-[11px] font-bold uppercase text-[#9CA3AF]">
                    <th className="py-3.5 px-4">Supplier</th>
                    <th className="py-3.5 px-4">PIC & Kontak</th>
                    <th className="py-3.5 px-4">Kategori</th>
                    <th className="py-3.5 px-4">Alamat</th>
                    <th className="py-3.5 px-4">Status</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-[#262D3D]">
                  {(dbState.suppliers || []).map(s => (
                    <tr key={s.id}>
                      <td className="py-3.5 px-4 font-bold text-white">{s.name}<div className="text-[11px] text-[#9CA3AF] font-normal">{s.id}</div></td>
                      <td className="py-3.5 px-4 text-white">{s.contact}<div className="text-[11px] text-[#9CA3AF]">{s.phone} • {s.email}</div></td>
                      <td className="py-3.5 px-4 text-[#60A5FA]">{s.type}</td>
                      <td className="py-3.5 px-4 text-[#9CA3AF]">{s.address}</td>
                      <td className="py-3.5 px-4"><StatusBadge status={s.status} /></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          {tab === "payables" && (
            <div className="bg-[#1B202B] border border-[#262D3D] rounded-2xl overflow-hidden">
              <table className="w-full text-left border-collapse text-xs">
                <thead>
                  <tr className="bg-[#151922] border-b border-[#262D3D] text-[11px] font-bold uppercase text-[#9CA3AF]">
                    <th className="py-3.5 px-4">Supplier</th>
                    <th className="py-3.5 px-4">No. Transaksi & Unit</th>
                    <th className="py-3.5 px-4 text-right">Total Pembelian</th>
                    <th className="py-3.5 px-4 text-right">Sisa Utang</th>
                    <th className="py-3.5 px-4">Jatuh Tempo</th>
                    <th className="py-3.5 px-4 text-right">Aksi</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-[#262D3D]">

                    <tr key={po.id}>
                      <td className="py-3.5 px-4 font-bold text-white">{po.sellerName}</td>
                      <td className="py-3.5 px-4 text-[#60A5FA]">{po.id} — <span className="text-white">{po.carName}</span></td>
                      <td className="py-3.5 px-4 text-right text-white">{formatIDR(po.totalPurchase)}</td>
                      <td className="py-3.5 px-4 text-right font-bold text-[#EF4444]">{formatIDR(po.remainingAmount)}</td>
                      <td className="py-3.5 px-4 text-white">{formatDateID(po.dueDate)}</td>
                      <td className="py-3.5 px-4 text-right">
                        <button onClick={() => handlePaySupplierDebt(po)} className="px-3 py-1.5 rounded-lg bg-[#22C55E]/15 text-[#22C55E] border border-[#22C55E]/30 font-semibold">Lunasi Utang</button>
                      </td>
                    </tr>
                  ))}
                  {!unpaidPurchases.length && (<tr><td colSpan="6" className="py-8 text-center text-[#9CA3AF]">Tidak ada utang supplier yang belum lunas.</td></tr>)}
                </tbody>
              </table>
            </div>
          )}

          {tab === "partners" && (
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              {(dbState.partners || []).map(p => (
                <div key={p.id} className="bg-[#1B202B] border border-[#262D3D] rounded-2xl p-5 space-y-2">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-bold text-[#60A5FA]">{p.category}</span>
                    <StatusBadge status={p.status} />
                  </div>
                  <h4 className="text-base font-bold text-white">{p.name}</h4>
                  <p className="text-xs text-[#9CA3AF]">PIC: {p.pic} ({p.phone})</p>
                  <div className="text-xs text-white pt-2 border-t border-[#262D3D]">Skema Kerja Sama: <strong>{p.commissionRate}</strong></div>
                </div>
              ))}
            </div>
          )}

          <Modal open={supModal} onClose={() => setSupModal(false)} title="Tambah Data Supplier" maxWidth="max-w-lg">
            <form onSubmit={handleAddSupplier} className="space-y-3 text-xs">
              <input required placeholder="Nama Perusahaan / Supplier *" value={supForm.name} onChange={(e) => setSupForm({ ...supForm, name: e.target.value })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white" />
              <div className="grid grid-cols-2 gap-3">
                <input required placeholder="Nama Kontak / PIC" value={supForm.contact} onChange={(e) => setSupForm({ ...supForm, contact: e.target.value })} className="bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white" />
                <input required placeholder="No. Telepon / WA" value={supForm.phone} onChange={(e) => setSupForm({ ...supForm, phone: e.target.value })} className="bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white" />
              </div>
              <input placeholder="Alamat Lengkap" value={supForm.address} onChange={(e) => setSupForm({ ...supForm, address: e.target.value })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white" />
              <div className="flex justify-end gap-2 pt-2">
                <button type="button" onClick={() => setSupModal(false)} className="px-4 py-2 rounded-xl bg-[#151922] text-[#9CA3AF]">Batal</button>
                <button type="submit" className="px-5 py-2 rounded-xl bg-[#2563EB] text-white font-semibold">Simpan Supplier</button>
              </div>
            </form>
          </Modal>
        </div>
      );
    }

    function BookingsModule({ dbState, setDbState, currentUser, appendAuditLog, pushNotification }) {
      const [modalOpen, setModalOpen] = useState(false);
      const [form, setForm] = useState({
        customerName: dbState.customers?.[0]?.name || "", carId: dbState.cars?.[0]?.id || "",
        date: todayISO(), time: "11:00", purpose: "Test Drive & Cek Fisik",
        pic: currentUser.name, status: "Terjadwal", notes: ""
      });

      const handleCreateBooking = (e) => {
        e.preventDefault();
        const car = (dbState.cars || []).find(c => c.id === form.carId);
        const bkgId = `BKG-2026-${String((dbState.bookings?.length || 0) + 1).padStart(3, "0")}`;
        const newBkg = { id: bkgId, ...form, carName: car ? `${car.brand} ${car.model} (${car.plateNumber})` : form.carId };
        setDbState(prev => ({ ...prev, bookings: [newBkg, ...prev.bookings] }));
        appendAuditLog("Booking", `Menjadwalkan booking ${bkgId} untuk ${form.customerName}`, bkgId);
        pushNotification("Jadwal Booking Baru", `${form.customerName} — ${form.purpose} (${formatDateID(form.date)} ${form.time})`, "bookings");
        setModalOpen(false);

        <div className="space-y-6">

              <div key={b.id} className="bg-[#1B202B] border border-[#262D3D] rounded-2xl p-5 space-y-3">
                <div className="flex items-center justify-between">
                  <span className="text-xs font-bold text-[#60A5FA]">{b.id}</span>
                  <StatusBadge status={b.status} />
                </div>
                <div>
                  <h4 className="text-sm font-bold text-white">{b.purpose}</h4>
                  <p className="text-xs text-[#9CA3AF] mt-0.5">{b.carName}</p>
                </div>
                <div className="p-3 rounded-xl bg-[#151922] border border-[#262D3D] text-xs space-y-1">

                  <div className="text-[#9CA3AF]">Jadwal: {formatDateID(b.date)} pukul {b.time} WIB</div>
                  <div className="text-[#9CA3AF]">PIC Sales: {b.pic}</div>

              </div>

              <div className="flex justify-end gap-2 pt-2">

    function ReportsAnalyticsModule({ dbState, setDbState, metrics, initialTab, userRoleSpec, appendAuditLog }) {

      const targets = dbState.targets || { monthlySalesUnits: 8, monthlyRevenueTarget: 4200000000, monthlyProfitTarget: 350000000, monthlyPurchaseUnits: 8 };
      const [targetForm, setTargetForm] = useState(targets);

      const handleUpdateTargets = (e) => {
        e.preventDefault();
        setDbState(prev => ({ ...prev, targets: targetForm }));
        appendAuditLog("Target & KPI", "Memperbarui target operasional bulanan showroom", "KPI-2026");
        Swal.fire({ icon: "success", title: "Target KPI Diperbarui", timer: 1500, showConfirmButton: false });
      };

      const revenueProgress = Math.min(100, Math.round((metrics.totalRevenue / (targets.monthlyRevenueTarget || 1)) * 100));
      const profitProgress = Math.min(100, Math.round((metrics.totalProfit / (targets.monthlyProfitTarget || 1)) * 100));
      const unitProgress = Math.min(100, Math.round((metrics.totalSalesCount / (targets.monthlySalesUnits || 1)) * 100));

      const handleExportFinanceExcel = () => {
        const rows = [
          { Indikator: "Pendapatan Penjualan (Omzet)", Nilai: metrics.totalRevenue },

          { Indikator: "Total Biaya Operasional", Nilai: metrics.totalExpenses },
          { Indikator: "Valuasi Modal Stok Aktif", Nilai: metrics.inventoryCapital },
          { Indikator: "Piutang Belum Tertagih", Nilai: metrics.totalReceivables },
          { Indikator: "Posisi Kas & Bank Akhir", Nilai: metrics.currentCashBalance }

                  <Icon name="file-spreadsheet" className="w-4 h-4 text-[#22C55E]" /> Export Excel
                </button>
              )}
              <button onClick={() => exportToPDF("Laporan Eksekutif AUTOVIA", "Ringkasan Laba Rugi & Neraca Operasional", ["Indikator Keuangan", "Nilai Aktual"], [["Total Omzet Penjualan", formatIDR(metrics.totalRevenue)], ["Total Modal Inventaris Aktif", formatIDR(metrics.inventoryCapital)], ["Total Keuntungan Bersih", formatIDR(metrics.totalProfit)], ["Total Pengeluaran Operasional", formatIDR(metrics.totalExpenses)], ["Saldo Akhir Kas & Bank", formatIDR(metrics.currentCashBalance)], ["Total Piutang Pelanggan", formatIDR(metrics.totalReceivables)], ["Total Utang Supplier", formatIDR(metrics.totalPayables)]], "AUTOVIA_Laporan_Keuangan")} className="px-4 py-2 rounded-xl bg-[#2563EB] text-xs font-semibold text-white flex items-center gap-2"><Icon name="printer" className="w-4 h-4" /> Export PDF</button>
            </div>
          </div>

          {tab === "targets" ? (
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
              <div className="lg:col-span-7 space-y-4">
                {[
                  { label: "Target Omzet Penjualan", actual: formatIDR(metrics.totalRevenue), target: formatIDR(targets.monthlyRevenueTarget), pct: revenueProgress },
                  { label: "Target Keuntungan Bersih", actual: formatIDR(metrics.totalProfit), target: formatIDR(targets.monthlyProfitTarget), pct: profitProgress },
                  { label: "Target Unit Terjual", actual: `${metrics.totalSalesCount} Unit`, target: `${targets.monthlySalesUnits} Unit`, pct: unitProgress }
                ].map((item, idx) => (
                  <div key={idx} className="bg-[#1B202B] border border-[#262D3D] rounded-2xl p-5 space-y-2">
                    <div className="flex justify-between text-xs">
                      <span className="font-bold text-white">{item.label}</span>
                      <span className="text-[#60A5FA] font-bold">{item.pct}% Tercapai</span>
                    </div>
                    <div className="w-full h-3 rounded-full bg-[#0B0D12] overflow-hidden">
                      <div className="h-full bg-[#2563EB] rounded-full transition-all" style={{ width: `${item.pct}%` }} />
                    </div>
                    <div className="flex justify-between text-[11px] text-[#9CA3AF]">
                      <span>Realisasi: {item.actual}</span>
                      <span>Target: {item.target}</span>
                    </div>
                  </div>
                ))}
              </div>

              {userRoleSpec.canApprove && (
                <div className="lg:col-span-5 bg-[#1B202B] border border-[#262D3D] rounded-2xl p-5">
                  <h4 className="text-sm font-bold text-white mb-4">Pengaturan Target Bisnis Bulanan</h4>
                  <form onSubmit={handleUpdateTargets} className="space-y-3 text-xs">
                    <div><label className="block text-[#9CA3AF] mb-1">Target Omzet Bulanan (Rp)</label><input type="number" value={targetForm.monthlyRevenueTarget} onChange={(e) => setTargetForm({ ...targetForm, monthlyRevenueTarget: Number(e.target.value) })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2 text-white" /></div>
                    <div><label className="block text-[#9CA3AF] mb-1">Target Keuntungan Bersih (Rp)</label><input type="number" value={targetForm.monthlyProfitTarget} onChange={(e) => setTargetForm({ ...targetForm, monthlyProfitTarget: Number(e.target.value) })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2 text-white" /></div>
                    <div><label className="block text-[#9CA3AF] mb-1">Target Unit Terjual</label><input type="number" value={targetForm.monthlySalesUnits} onChange={(e) => setTargetForm({ ...targetForm, monthlySalesUnits: Number(e.target.value) })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2 text-white" /></div>
                    <button type="submit" className="w-full py-2.5 rounded-xl bg-[#2563EB] text-white font-semibold">Simpan Target KPI</button>
                  </form>
                </div>
              )}
            </div>
          ) : (
            <div className="bg-[#1B202B] border border-[#262D3D] rounded-2xl p-6 space-y-4">
              <h4 className="text-base font-bold text-white">Ringkasan Laporan Keuangan & Laba Rugi Showroom</h4>
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 text-xs">
                <div className="p-4 rounded-xl bg-[#151922] border border-[#262D3D]"><div className="text-[#9CA3AF]">Pendapatan Penjualan (Omzet)</div><div className="text-lg font-extrabold text-white mt-1">{formatIDR(metrics.totalRevenue)}</div></div>
                <div className="p-4 rounded-xl bg-[#151922] border border-[#262D3D]"><div className="text-[#9CA3AF]">Keuntungan Bersih Penjualan</div><div className="text-lg font-extrabold text-[#22C55E] mt-1">{formatIDR(metrics.totalProfit)}</div></div>
                <div className="p-4 rounded-xl bg-[#151922] border border-[#262D3D]"><div className="text-[#9CA3AF]">Total Biaya Operasional</div><div className="text-lg font-extrabold text-[#EF4444] mt-1">{formatIDR(metrics.totalExpenses)}</div></div>
                <div className="p-4 rounded-xl bg-[#151922] border border-[#262D3D]"><div className="text-[#9CA3AF]">Valuasi Modal Stok Aktif</div><div className="text-lg font-extrabold text-[#60A5FA] mt-1">{formatIDR(metrics.inventoryCapital)}</div></div>
                <div className="p-4 rounded-xl bg-[#151922] border border-[#262D3D]"><div className="text-[#9CA3AF]">Piutang Belum Tertagih</div><div className="text-lg font-extrabold text-[#F59E0B] mt-1">{formatIDR(metrics.totalReceivables)}</div></div>
                <div className="p-4 rounded-xl bg-[#151922] border border-[#262D3D]"><div className="text-[#9CA3AF]">Posisi Kas & Bank Akhir</div><div className="text-lg font-extrabold text-white mt-1">{formatIDR(metrics.currentCashBalance)}</div></div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function EmployeesAdminsModule({ dbState, setDbState, initialTab, userRoleSpec, appendAuditLog, fbService }) {
      const [tab, setTab] = useState(initialTab || "employees");
      const [adminModal, setAdminModal] = useState(false);
      const [adminForm, setAdminForm] = useState({ name: "", email: "", password: "", role: "SALES", status: "Aktif" });
      const [submittingAdmin, setSubmittingAdmin] = useState(false);

      const handleAddAdmin = async (e) => {
        e.preventDefault();
        if (!userRoleSpec.canManageUsers) {
          Swal.fire("Akses Ditolak", "Hanya Super Admin yang dapat menambahkan akun admin.", "error");
          return;
        }
        if (!adminForm.password || adminForm.password.length < 6) {
          Swal.fire("Validasi", "Kata sandi minimal 6 karakter.", "warning");
          return;
        }
        if (!fbService.connected || !fbService.auth) {
          Swal.fire("Gagal", "Firebase Authentication belum terhubung.", "error");
          return;
        }

        setSubmittingAdmin(true);
        try {
          const secondaryAppName = `admin-creator-${Date.now()}`;
          const secondaryApp = firebase.initializeApp(fbService.auth.app.options, secondaryAppName);
          const secondaryAuth = secondaryApp.auth();

          const userCredential = await secondaryAuth.createUserWithEmailAndPassword(adminForm.email, adminForm.password);
          const newUid = userCredential.user.uid;

          await secondaryApp.delete();

          const id = newUid;
          const newUserData = {
            id,
            uid: id,
            name: adminForm.name,
            email: adminForm.email,
            role: adminForm.role,
            status: "Aktif",
            active: true,
            lastLogin: "Belum pernah login",
            createdAt: new Date().toLocaleString("id-ID")
          };

          setDbState(prev => ({
            ...prev,
            users: [newUserData, ...prev.users]
          }));

          await fbService.db.collection("users").doc(id).set(newUserData);

          appendAuditLog("Hak Akses", `Menambahkan akun internal baru ${adminForm.email} (${adminForm.role})`, id);
          Swal.fire({ icon: "success", title: "Akun Berhasil Dibuat", text: "Pengguna baru telah terdaftar di Firebase dan Firestore.", timer: 2000, showConfirmButton: false });
          setAdminModal(false);
          setAdminForm({ name: "", email: "", password: "", role: "SALES", status: "Aktif" });
        } catch (err) {
          Swal.fire("Gagal Membuat Akun", mapFirebaseAuthError(err), "error");
        } finally {
          setSubmittingAdmin(false);
        }
      };

      return (
        <div className="space-y-6">
          <div className="flex flex-wrap items-center justify-between gap-3 bg-[#151922] border border-[#262D3D] p-4 rounded-2xl">
            <div className="flex gap-2">
              <button onClick={() => setTab("employees")} className={`px-4 py-2 rounded-xl text-xs font-semibold ${tab === "employees" ? "bg-[#2563EB] text-white" : "bg-[#1B202B] text-[#9CA3AF]"}`}>Direktori Karyawan ({dbState.employees?.length || 0})</button>
              <button onClick={() => setTab("admins")} className={`px-4 py-2 rounded-xl text-xs font-semibold ${tab === "admins" ? "bg-[#2563EB] text-white" : "bg-[#1B202B] text-[#9CA3AF]"}`}>Akun Admin & Role RBAC ({dbState.users?.length || 0})</button>
            </div>
            {tab === "admins" && userRoleSpec.canManageUsers && (<button onClick={() => setAdminModal(true)} className="px-4 py-2 rounded-xl bg-[#2563EB] text-xs font-semibold text-white flex items-center gap-2"><Icon name="user-plus" className="w-4 h-4" /> Undang / Buat Akun Admin</button>)}
          </div>

          {tab === "employees" ? (
            <div className="bg-[#1B202B] border border-[#262D3D] rounded-2xl overflow-hidden">
              <table className="w-full text-left border-collapse text-xs">
                <thead>
                  <tr className="bg-[#151922] border-b border-[#262D3D] text-[11px] font-bold uppercase text-[#9CA3AF]">
                    <th className="py-3.5 px-4">Karyawan</th>
                    <th className="py-3.5 px-4">Jabatan</th>
                    <th className="py-3.5 px-4">Kontak</th>
                    <th className="py-3.5 px-4">Tgl Bergabung</th>
                    <th className="py-3.5 px-4">Status</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-[#262D3D]">
                  {(dbState.employees || []).map(emp => (
                    <tr key={emp.id}>
                      <td className="py-3.5 px-4 font-bold text-white">{emp.name}<div className="text-[11px] text-[#9CA3AF] font-normal">{emp.id}</div></td>
                      <td className="py-3.5 px-4 text-[#60A5FA]">{emp.position}</td>
                      <td className="py-3.5 px-4 text-white">{emp.phone}<div className="text-[11px] text-[#9CA3AF]">{emp.email}</div></td>
                      <td className="py-3.5 px-4 text-white">{formatDateID(emp.joinDate)}</td>
                      <td className="py-3.5 px-4"><StatusBadge status={emp.status} /></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          ) : (
            <div className="bg-[#1B202B] border border-[#262D3D] rounded-2xl overflow-hidden">
              <table className="w-full text-left border-collapse text-xs">
                <thead>
                  <tr className="bg-[#151922] border-b border-[#262D3D] text-[11px] font-bold uppercase text-[#9CA3AF]">
                    <th className="py-3.5 px-4">Nama Pengguna</th>
                    <th className="py-3.5 px-4">Email Login</th>
                    <th className="py-3.5 px-4">Role & Hak Akses</th>
                    <th className="py-3.5 px-4">Login Terakhir</th>
                    <th className="py-3.5 px-4">Status</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-[#262D3D]">
                  {(dbState.users || []).map(u => (
                    <tr key={u.id}>
                      <td className="py-3.5 px-4 font-bold text-white">{u.name}</td>
                      <td className="py-3.5 px-4 text-[#9CA3AF]">{u.email}</td>
                      <td className="py-3.5 px-4">
                        {userRoleSpec.canManageUsers ? (
                          <select value={u.role} onChange={(e) => { const newRole = e.target.value; setDbState(prev => ({ ...prev, users: prev.users.map(item => item.id === u.id ? { ...item, role: newRole } : item) })); appendAuditLog("Hak Akses", `Mengubah role ${u.email} menjadi ${newRole}`, u.id); }} className="bg-[#0B0D12] border border-[#262D3D] rounded-lg px-2.5 py-1 text-white">
                            {Object.keys(ROLES).map(r => <option key={r} value={r}>{r}</option>)}
                          </select>
                        ) : <StatusBadge status={u.role} />}
                      </td>
                      <td className="py-3.5 px-4 text-[#9CA3AF]">{u.lastLogin}</td>
                      <td className="py-3.5 px-4"><StatusBadge status={u.status} /></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          <Modal open={adminModal} onClose={() => setAdminModal(false)} title="Daftarkan Akun Internal Baru" maxWidth="max-w-md">
            <form onSubmit={handleAddAdmin} className="space-y-3 text-xs">
              <input required placeholder="Nama Lengkap *" value={adminForm.name} onChange={(e) => setAdminForm({ ...adminForm, name: e.target.value })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white" />
              <input required type="email" placeholder="Email Perusahaan (@autovia.co.id) *" value={adminForm.email} onChange={(e) => setAdminForm({ ...adminForm, email: e.target.value })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white" />
              <input required type="password" placeholder="Kata Sandi (Minimal 6 Karakter) *" value={adminForm.password} onChange={(e) => setAdminForm({ ...adminForm, password: e.target.value })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white" />
              <select value={adminForm.role} onChange={(e) => setAdminForm({ ...adminForm, role: e.target.value })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white">
                {Object.values(ROLES).map(r => <option key={r.id} value={r.id}>{r.label} ({r.id})</option>)}
              </select>
              <div className="flex justify-end gap-2 pt-2">
                <button type="button" onClick={() => setAdminModal(false)} className="px-4 py-2 rounded-xl bg-[#151922] text-[#9CA3AF]">Batal</button>
                <button type="submit" disabled={submittingAdmin} className="px-5 py-2 rounded-xl bg-[#2563EB] text-white font-semibold disabled:opacity-50">
                  {submittingAdmin ? "Memproses..." : "Simpan Akun"}
                </button>
              </div>
            </form>
          </Modal>
        </div>
      );
    }

    function NotificationsModule({ dbState, setDbState, setActivePage }) {
      const markAllRead = () => {
        setDbState(prev => ({ ...prev, notifications: (prev.notifications || []).map(n => ({ ...n, read: true })) }));
      };

      return (
        <div className="space-y-4">
          <div className="flex items-center justify-between bg-[#151922] border border-[#262D3D] p-4 rounded-2xl">
            <h3 className="text-sm font-bold text-white">Pusat Notifikasi Internal</h3>
            <button onClick={markAllRead} className="px-3.5 py-2 rounded-xl bg-[#1B202B] border border-[#262D3D] text-xs font-semibold text-[#60A5FA]">Tandai Semua Sudah Dibaca</button>
          </div>
          <div className="space-y-3">
            {(dbState.notifications || []).map(n => (
              <div key={n.id} onClick={() => { setDbState(prev => ({ ...prev, notifications: prev.notifications.map(item => item.id === n.id ? { ...item, read: true } : item) })); if (n.targetPage) setActivePage(n.targetPage); }}
                className={`p-4 rounded-2xl border cursor-pointer transition flex items-start justify-between gap-4 ${n.read ? "bg-[#151922] border-[#262D3D]" : "bg-[#1B202B] border-[#2563EB]/60"}`}>
                <div>
                  <div className="flex items-center gap-2">
                    {!n.read && <span className="w-2 h-2 rounded-full bg-[#2563EB]" />}
                    <span className="text-xs font-bold text-white">{n.title}</span>
                  </div>
                  <p className="text-xs text-[#9CA3AF] mt-1">{n.message}</p>
                </div>
                <span className="text-[11px] text-[#9CA3AF] shrink-0">{n.time}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function AuditLogsModule({ dbState }) {
      return (
        <div className="bg-[#1B202B] border border-[#262D3D] rounded-2xl overflow-hidden">
          <div className="p-4 bg-[#151922] border-b border-[#262D3D] flex items-center justify-between">
            <div>
              <h3 className="text-sm font-bold text-white">Audit Log & Jejak Aktivitas Sistem</h3>
              <p className="text-xs text-[#9CA3AF]">Catatan permanen seluruh perubahan data, transaksi, dan akses pengguna.</p>
            </div>
            <button onClick={() => exportToExcel(dbState.auditLogs, "AUTOVIA_Audit_Log")} className="px-3.5 py-2 rounded-xl bg-[#1B202B] border border-[#262D3D] text-xs font-semibold text-white">Export Log Excel</button>
          </div>
          <div className="overflow-x-auto">
            <table className="w-full text-left border-collapse text-xs">
              <thead>
                <tr className="bg-[#151922] border-b border-[#262D3D] text-[11px] font-bold uppercase text-[#9CA3AF]">
                  <th className="py-3 px-4">Waktu</th>
                  <th className="py-3 px-4">Admin & Role</th>
                  <th className="py-3 px-4">Modul</th>
                  <th className="py-3 px-4">Aktivitas</th>
                  <th className="py-3 px-4">ID Referensi</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-[#262D3D]">
                {(dbState.auditLogs || []).map(l => (
                  <tr key={l.id}>
                    <td className="py-3 px-4 text-[#9CA3AF]">{l.timestamp}</td>
                    <td className="py-3 px-4 font-semibold text-white">{l.user} <span className="text-[10px] text-[#60A5FA]">({l.role})</span></td>
                    <td className="py-3 px-4"><StatusBadge status={l.module} /></td>
                    <td className="py-3 px-4 text-white">{l.action}</td>
                    <td className="py-3 px-4 text-[#9CA3AF]">{l.target}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    function BackupRestoreModule({ dbState, setDbState, appendAuditLog }) {
      const [restorePreview, setRestorePreview] = useState(null);
      const [mergeStrategy, setMergeStrategy] = useState("merge");

      const handleDownloadJSONBackup = () => {
        const payload = { exportedAt: new Date().toISOString(), system: "AUTOVIA_SHOWROOM_ERP", collections: dbState };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `AUTOVIA_Backup_${todayISO()}.json`;
        a.click();
        URL.revokeObjectURL(url);
        appendAuditLog("Backup & Restore", "Mengunduh full backup JSON database", "JSON-BACKUP");
      };

      const handleSelectRestoreFile = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const parsed = JSON.parse(ev.target.result);
            const collections = parsed.collections || parsed;
            if (!collections.cars || !collections.sales) throw new Error("Struktur file JSON backup AUTOVIA tidak valid.");
            setRestorePreview({ fileName: file.name, exportedAt: parsed.exportedAt || "Tidak diketahui", carsCount: collections.cars?.length || 0, salesCount: collections.sales?.length || 0, customersCount: collections.customers?.length || 0, raw: collections });
          } catch (err) { Swal.fire("Validasi Backup Gagal", err.message, "error"); }
        };
        reader.readAsText(file);
      };

      const executeRestore = () => {
        if (!restorePreview) return;
        setDbState(prev => {
          if (mergeStrategy === "replace") return restorePreview.raw;
          const mergeArr = (oldArr = [], newArr = []) => {
            const map = new Map(oldArr.map(i => [i.id, i]));
            newArr.forEach(i => map.set(i.id, i));
            return Array.from(map.values());
          };
          return {
            ...prev,
            cars: mergeArr(prev.cars, restorePreview.raw.cars),
            purchases: mergeArr(prev.purchases, restorePreview.raw.purchases),
            sales: mergeArr(prev.sales, restorePreview.raw.sales),
            customers: mergeArr(prev.customers, restorePreview.raw.customers),
            suppliers: mergeArr(prev.suppliers, restorePreview.raw.suppliers),
            expenses: mergeArr(prev.expenses, restorePreview.raw.expenses)
          };
        });
        appendAuditLog("Backup & Restore", `Melakukan restore data (${mergeStrategy}) dari ${restorePreview.fileName}`, "RESTORE");
        setRestorePreview(null);
        Swal.fire({ icon: "success", title: "Restore Berhasil Dijalankan", timer: 1800, showConfirmButton: false });
      };

      return (
        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <div className="bg-[#1B202B] border border-[#262D3D] rounded-2xl p-6 space-y-4">
            <h4 className="text-base font-bold text-white">Backup Database Showroom</h4>
            <p className="text-xs text-[#9CA3AF] leading-relaxed">Unduh salinan lengkap seluruh koleksi inventaris, pembelian, penjualan, keuangan, pelanggan, dan pengaturan ke format JSON terstruktur atau Excel.</p>
            <div className="p-3.5 rounded-xl bg-amber-500/10 border border-amber-500/30 text-xs text-amber-300">Catatan Penting: Backup database JSON/Firestore mencadangkan metadata & URL foto, namun tidak otomatis mengunduh file media fisik di penyimpanan Cloudinary.</div>
            <div className="flex flex-wrap gap-3 pt-2">
              <button onClick={handleDownloadJSONBackup} className="px-4 py-2.5 rounded-xl bg-[#2563EB] text-xs font-semibold text-white flex items-center gap-2"><Icon name="download" className="w-4 h-4" /> Download Backup JSON</button>
              <button onClick={() => exportToExcel(dbState.cars, "AUTOVIA_Full_Inventory_Backup")} className="px-4 py-2.5 rounded-xl bg-[#151922] border border-[#262D3D] text-xs font-semibold text-white flex items-center gap-2"><Icon name="file-spreadsheet" className="w-4 h-4 text-[#22C55E]" /> Backup Inventaris Excel</button>
            </div>
          </div>

          <div className="bg-[#1B202B] border border-[#262D3D] rounded-2xl p-6 space-y-4">
            <h4 className="text-base font-bold text-white">Restore Data dari File JSON</h4>
            <p className="text-xs text-[#9CA3AF]">Unggah file backup JSON AUTOVIA untuk melihat pratinjau data dan deteksi duplikasi sebelum diterapkan.</p>
            <input type="file" accept=".json" onChange={handleSelectRestoreFile} className="block w-full text-xs text-[#9CA3AF] file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-[#2563EB] file:text-white" />
            {restorePreview && (
              <div className="p-4 rounded-xl bg-[#151922] border border-[#262D3D] space-y-3 text-xs">
                <div className="font-bold text-white">Preview File: {restorePreview.fileName}</div>
                <div className="text-[#9CA3AF]">Unit: {restorePreview.carsCount} • Penjualan: {restorePreview.salesCount} • Pelanggan: {restorePreview.customersCount}</div>
                <div>
                  <label className="block text-[#9CA3AF] mb-1">Strategi Penggabungan:</label>
                  <select value={mergeStrategy} onChange={(e) => setMergeStrategy(e.target.value)} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2 text-white">
                    <option value="merge">Gabungkan & Perbarui ID yang Sama (Aman - Tanpa Hapus Data Lama)</option>
                    <option value="replace">Timpa Seluruh Koleksi dengan File Backup</option>
                  </select>
                </div>
                <button onClick={executeRestore} className="w-full py-2.5 rounded-xl bg-[#22C55E] text-black font-bold">Konfirmasi & Jalankan Restore</button>
              </div>
            )}
          </div>
        </div>
      );
    }

    function SettingsModule({ dbState, setDbState, configObj, setConfigObj, fbService, appendAuditLog }) {
      const [showForm, setShowForm] = useState(dbState.settings);

      const handleSaveGeneral = (e) => {
        e.preventDefault();
        setDbState(prev => ({ ...prev, settings: showForm }));
        appendAuditLog("Pengaturan", "Memperbarui profil & pengaturan operasional showroom", "SETTINGS");
        Swal.fire({ icon: "success", title: "Pengaturan Disimpan", timer: 1500, showConfirmButton: false });
      };

      return (
        <div className="space-y-6">
          <div className="bg-[#1B202B] border border-[#262D3D] rounded-2xl p-6">
            <h4 className="text-base font-bold text-white mb-4">Identitas Perusahaan & Keuangan</h4>
            <form onSubmit={handleSaveGeneral} className="space-y-3 text-xs">
              <div><label className="block text-[#9CA3AF] mb-1">Nama Showroom</label><input value={showForm.showroomName} onChange={(e) => setShowForm({ ...showForm, showroomName: e.target.value })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white" /></div>
              <div><label className="block text-[#9CA3AF] mb-1">Alamat Showroom</label><input value={showForm.address} onChange={(e) => setShowForm({ ...showForm, address: e.target.value })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white" /></div>
              <div className="grid grid-cols-2 gap-3">
                <div><label className="block text-[#9CA3AF] mb-1">Telepon</label><input value={showForm.phone} onChange={(e) => setShowForm({ ...showForm, phone: e.target.value })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white" /></div>
                <div><label className="block text-[#9CA3AF] mb-1">Saldo Awal Kas (Rp)</label><input type="number" value={showForm.openingCashBalance} onChange={(e) => setShowForm({ ...showForm, openingCashBalance: Number(e.target.value) })} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white" /></div>
              </div>
              <button type="submit" className="px-5 py-2.5 rounded-xl bg-[#2563EB] text-white font-semibold">Simpan Pengaturan Umum</button>
            </form>
          </div>
        </div>
      );
    }

    function ProfileModule({ currentUser, setCurrentUser, dbState, setDbState, fbService, appendAuditLog }) {
      const [name, setName] = useState(currentUser.name);
      const [newPass, setNewPass] = useState("");
      const [saving, setSaving] = useState(false);

      const handleUpdateProfile = async (e) => {
        e.preventDefault();
        setSaving(true);
        try {
          const updated = { ...currentUser, name };
          setCurrentUser(updated);
          setDbState(prev => ({ ...prev, users: prev.users.map(u => u.id === currentUser.id ? updated : u) }));
          if (fbService.connected && fbService.auth?.currentUser) {
            await fbService.auth.currentUser.updateProfile({ displayName: name });
            if (newPass) {
              if (newPass.length < 6) throw new Error("Kata sandi baru minimal 6 karakter.");
              await fbService.auth.currentUser.updatePassword(newPass);
            }
          }
          appendAuditLog("Profil Admin", `Memperbarui profil akun ${currentUser.email}`, currentUser.id);
          setNewPass("");
          Swal.fire({ icon: "success", title: "Profil & Keamanan Diperbarui", timer: 1600, showConfirmButton: false });
        } catch (err) {
          Swal.fire("Gagal Memperbarui", mapFirebaseAuthError(err), "error");
        } finally {
          setSaving(false);
        }
      };

      return (
        <div className="max-w-xl bg-[#1B202B] border border-[#262D3D] rounded-2xl p-6 space-y-4">
          <div className="flex items-center gap-4">
            <div className="w-14 h-14 rounded-2xl bg-[#2563EB] flex items-center justify-center text-xl font-extrabold text-white">{currentUser.name.charAt(0)}</div>
            <div>
              <h3 className="text-lg font-bold text-white">{currentUser.name}</h3>
              <p className="text-xs text-[#9CA3AF]">{currentUser.email} • {currentUser.role}</p>
            </div>
          </div>
          <form onSubmit={handleUpdateProfile} className="space-y-3 text-xs pt-2">
            <div><label className="block text-[#9CA3AF] mb-1">Nama Lengkap</label><input value={name} onChange={(e) => setName(e.target.value)} className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white" /></div>
            <div><label className="block text-[#9CA3AF] mb-1">Ubah Kata Sandi Baru (Opsional)</label><input type="password" value={newPass} onChange={(e) => setNewPass(e.target.value)} placeholder="Minimal 6 karakter" className="w-full bg-[#0B0D12] border border-[#262D3D] rounded-xl px-3 py-2.5 text-white" /></div>
            <button type="submit" disabled={saving} className="px-5 py-2.5 rounded-xl bg-[#2563EB] text-white font-semibold disabled:opacity-50">{saving ? "Menyimpan..." : "Simpan Perubahan Profil"}</button>
          </form>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
